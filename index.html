<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squeekchain Genesis Runner</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #050811;
            color: #00ffcc;
            font-family: 'Press Start 2P', monospace;
            margin: 0;
            padding: 10px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow-x: hidden;
        }

        /* Background starfield animation */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                radial-gradient(1px 1px at 20px 30px, #00ffcc, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 100px 150px, #ff00ff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 200px 80px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 300px 250px, #00ffcc, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 350px 350px;
            opacity: 0.3;
            z-index: -1;
        }

        header {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: rgba(10, 20, 35, 0.85);
            border: 2px solid #00ffcc;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
            margin-bottom: 10px;
        }

        .title {
            font-size: 10px;
            color: #ffffff;
            text-shadow: 0 0 5px #00ffcc;
        }

        .btn-wallet {
            background: #ff007a;
            color: #fff;
            border: none;
            padding: 8px 10px;
            font-family: inherit;
            font-size: 8px;
            cursor: pointer;
            border-radius: 4px;
            box-shadow: 0 0 8px rgba(255, 0, 122, 0.5);
            transition: 0.2s;
        }

        .btn-wallet:hover {
            transform: scale(1.05);
            background: #ff2a9d;
        }

        .game-wrapper {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 480px;
            background: #000;
            border: 3px solid #00ffcc;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .dashboard-grid {
            width: 100%;
            max-width: 480px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .stat-card {
            background: rgba(10, 20, 35, 0.85);
            border: 1px solid #1f3552;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
        }

        .stat-card .label {
            font-size: 7px;
            color: #8fa0b5;
            margin-bottom: 5px;
        }

        .stat-card .value {
            font-size: 12px;
            color: #00ffcc;
            text-shadow: 0 0 4px #00ffcc;
        }

        footer {
            margin-top: 10px;
            font-size: 7px;
            color: #5d738e;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <div class="title">🐹 SQUEEK Genesis v2.0</div>
        <button class="btn-wallet" id="walletBtn" onclick="connectWallet()">CONNECT WALLET</button>
    </header>

    <div class="game-wrapper">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
    </div>

    <div class="dashboard-grid">
        <div class="stat-card">
            <div class="label">DISTANCE</div>
            <div class="value" id="uiDist">0 m</div>
        </div>
        <div class="stat-card">
            <div class="label">$SQK COINS</div>
            <div class="value" id="uiCoins">0</div>
        </div>
        <div class="stat-card">
            <div class="label">ENERGY</div>
            <div class="value" id="uiEnergy">100%</div>
        </div>
        <div class="stat-card">
            <div class="label">CHAIN STATUS</div>
            <div class="value" style="color: #ff007a;" id="uiChain">OFFLINE</div>
        </div>
    </div>

    <footer>TAP/SPACE TO JUMP • KEEP HAMSTER ALIVE</footer>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let gameState = "START"; // START, PLAYING, GAMEOVER
        let score = 0;
        let coins = 0;
        let energy = 100;
        let walletAddress = null;

        let hamster = { x: 80, y: 280, vy: 0, grounded: true, radius: 14 };
        let obstacles = [];
        let coinItems = [];
        let wheelAngle = 0;
        let frame = 0;

        function connectWallet() {
            if (window.ethereum) {
                window.ethereum.request({ method: 'eth_requestAccounts' }).then(accs => {
                    walletAddress = accs[0];
                    document.getElementById("walletBtn").innerText = walletAddress.substring(0, 6) + "..." + walletAddress.substring(38);
                    document.getElementById("uiChain").innerText = "ONLINE";
                    document.getElementById("uiChain").style.color = "#00ffcc";
                }).catch(() => {});
            } else {
                alert("MetaMask / Web3 Wallet required.");
            }
        }

        function jump() {
            if (gameState === "START" || gameState === "GAMEOVER") {
                resetGame();
                gameState = "PLAYING";
            } else if (hamster.grounded) {
                hamster.vy = -9;
                hamster.grounded = false;
            }
        }

        window.addEventListener("keydown", (e) => { if (e.code === "Space") jump(); });
        canvas.addEventListener("touchstart", (e) => { e.preventDefault(); jump(); });
        canvas.addEventListener("click", jump);

        function resetGame() {
            score = 0;
            coins = 0;
            energy = 100;
            hamster.y = 280;
            hamster.vy = 0;
            obstacles = [];
            coinItems = [];
            frame = 0;
        }

        function update() {
            if (gameState !== "PLAYING") return;

            frame++;
            score += 0.1;
            energy -= 0.03;
            wheelAngle += 0.05;

            if (energy <= 0) gameState = "GAMEOVER";

            // Gravity & movement
            hamster.vy += 0.45;
            hamster.y += hamster.vy;

            if (hamster.y >= 280) {
                hamster.y = 280;
                hamster.vy = 0;
                hamster.grounded = true;
            }

            // Obstacles & Coins Spawning
            if (frame % 90 === 0) {
                obstacles.push({ x: 420, size: 18 });
            }
            if (frame % 120 === 0) {
                coinItems.push({ x: 420, y: 230 - Math.random() * 50 });
            }

            // Move Obstacles
            obstacles.forEach((obs, idx) => {
                obs.x -= 4;
                // Collision
                if (Math.abs(obs.x - hamster.x) < 20 && hamster.y > 260) {
                    energy -= 20;
                    obstacles.splice(idx, 1);
                }
            });

            // Move Coins
            coinItems.forEach((c, idx) => {
                c.x -= 4;
                if (Math.abs(c.x - hamster.x) < 20 && Math.abs(c.y - hamster.y) < 20) {
                    coins += 1;
                    energy = Math.min(100, energy + 10);
                    coinItems.splice(idx, 1);
                }
            });

            obstacles = obstacles.filter(o => o.x > -20);
            coinItems = coinItems.filter(c => c.x > -20);

            // Update UI
            document.getElementById("uiDist").innerText = Math.floor(score) + " m";
            document.getElementById("uiCoins").innerText = coins;
            document.getElementById("uiEnergy").innerText = Math.max(0, Math.floor(energy)) + "%";
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Wheel Background
            ctx.strokeStyle = "#162b42";
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.arc(200, 200, 160, 0, Math.PI * 2);
            ctx.stroke();

            // Wheel Spokes
            for (let i = 0; i < 8; i++) {
                let ang = wheelAngle + (i * Math.PI / 4);
                ctx.strokeStyle = "#0e1d2e";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(200, 200);
                ctx.lineTo(200 + Math.cos(ang) * 160, 200 + Math.sin(ang) * 160);
                ctx.stroke();
            }

            // Track Ground
            ctx.strokeStyle = "#00ffcc";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(200, 200, 150, 0.25 * Math.PI, 0.75 * Math.PI);
            ctx.stroke();

            if (gameState === "PLAYING") {
                // Draw Hamster
                ctx.fillStyle = "#ffb703";
                ctx.beginPath();
                ctx.arc(hamster.x, hamster.y, hamster.radius, 0, Math.PI * 2);
                ctx.fill();

                // Draw Obstacles
                ctx.fillStyle = "#ff007a";
                obstacles.forEach(obs => {
                    ctx.fillRect(obs.x, 270, obs.size, obs.size);
                });

                // Draw Coins
                ctx.fillStyle = "#00ffcc";
                coinItems.forEach(c => {
                    ctx.beginPath();
                    ctx.arc(c.x, c.y, 7, 0, Math.PI * 2);
                    ctx.fill();
                });
            } else if (gameState === "START") {
                ctx.fillStyle = "#ffffff";
                ctx.font = "12px 'Press Start 2P'";
                ctx.textAlign = "center";
                ctx.fillText("TAP / SPACE TO RUN", 200, 190);
                ctx.fillStyle = "#00ffcc";
                ctx.font = "8px 'Press Start 2P'";
                ctx.fillText("KEEP THE WHEEL SPINNING!", 200, 220);
            } else if (gameState === "GAMEOVER") {
                ctx.fillStyle = "#ff007a";
                ctx.font = "14px 'Press Start 2P'";
                ctx.textAlign = "center";
                ctx.fillText("EXHAUSTED!", 200, 180);
                ctx.fillStyle = "#ffffff";
                ctx.font = "8px 'Press Start 2P'";
                ctx.fillText("FINAL DISTANCE: " + Math.floor(score) + "m", 200, 210);
                ctx.fillText("TAP TO TRY AGAIN", 200, 230);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
