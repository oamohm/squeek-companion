<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Squeekchain Hamster Wheel</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d1117;
            color: #58a6ff;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            padding: 15px;
            overflow: hidden;
        }

        .container {
            border: 2px solid #30363d;
            background: #161b22;
            padding: 25px 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }

        h1 {
            font-size: 14px;
            color: #c9d1d9;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        p {
            color: #8b949e;
            font-size: 8px;
            margin-bottom: 20px;
        }

        .counter-display {
            font-size: 32px;
            font-weight: bold;
            color: #3fb950;
            margin: 20px 0;
            text-shadow: 0 0 10px rgba(63, 185, 80, 0.3);
        }

        .btn-spin {
            background: #238636;
            color: white;
            border: none;
            padding: 14px;
            font-size: 10px;
            font-family: inherit;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 10px rgba(35, 134, 54, 0.4);
            transition: transform 0.1s;
        }

        .btn-spin:active {
            transform: scale(0.97);
        }

        .wallet-status {
            margin-top: 15px;
            font-size: 7px;
            color: #ff007a;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Squeekchain Wheel</h1>
        <p>Tap to spin and boost rotations</p>
        <div class="counter-display" id="counter">1048</div>
        <button class="btn-spin" onclick="spinWheel()">SPIN WHEEL 🐹</button>
        <div class="wallet-status" id="walletText">Squeekchain Genesis Active</div>
    </div>

    <script>
        let count = localStorage.getItem("sqk_rotations") ? parseInt(localStorage.getItem("sqk_rotations")) : 1048;
        document.getElementById('counter').innerText = count;

        function spinWheel() {
            count += 1;
            document.getElementById('counter').innerText = count;
            localStorage.setItem("sqk_rotations", count);
        }
    </script>

</body>
</html>
