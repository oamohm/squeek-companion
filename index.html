<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squeekchain AI Wheel Companion</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: monospace, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            border: 2px dashed #4caf50;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            max-width: 400px;
            background: #1e1e1e;
        }
        button {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
            border-radius: 4px;
            margin-top: 15px;
        }
        button:hover {
            background-color: #45a049;
        }
        #output {
            margin-top: 15px;
            font-weight: bold;
            color: #81c784;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Squeek AI Wheel Predictor</h2>
        <p>Live companion tool to simulate and predict hamster economic distance metrics.</p>
        <button onclick="runPrediction()">Generate AI Prediction</button>
        <div id="output">Status: Ready for input...</div>
    </div>

    <script>
        function runPrediction() {
            const outputDiv = document.getElementById("output");
            outputDiv.innerText = "Analyzing live network metrics...";
            
            setTimeout(() => {
                const randomDistance = (Math.random() * 50 + 10).toFixed(2);
                const efficiency = (Math.random() * 20 + 80).toFixed(1);
                outputDiv.innerHTML = `Predicted Distance: ${randomDistance}m<br>Network Efficiency: ${efficiency}%`;
            }, 1000);
        }
    </script>
</body>
</html>
