<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squeekchain Hamster Companion</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #0d1117;
            color: #58a6ff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            border: 2px solid #30363d;
            background: #161b22;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 100%;
        }
        h1 {
            font-size: 22px;
            color: #c9d1d9;
            margin-bottom: 10px;
        }
        p {
            color: #8b949e;
            font-size: 14px;
        }
        .counter-display {
            font-size: 36px;
            font-weight: bold;
            color: #3fb950;
            margin: 20px 0;
        }
        button {
            background: #238636;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }
        button:hover {
            background: #2ea043;
        }
        button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Squeekchain Hamster Wheel</h1>
        <p>Total Wheel Rotations</p>
        <div class="counter-display" id="counter">1042</div>
        <button onclick="boostWheel()">Spin Wheel 🐹</button>
    </div>

    <script>
        let count = 1042;
        function boostWheel() {
            count += 1;
            document.getElementById('counter').innerText = count;
        }
    </script>

</body>
</html>
