<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squeekchain Advanced Live Companion & Telemetry</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --border-color: #1f2937;
            --accent-green: #10b981;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .header {
            text-align: center;
            margin-bottom: 15px;
        }
        .header h1 {
            color: var(--accent-green);
            font-size: 1.6rem;
            margin: 0 0 5px 0;
        }
        .header p {
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        .dashboard {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            width: 100%;
            max-width: 550px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        .stat-box {
            background: rgba(31, 41, 55, 0.5);
            padding: 10px;
            border-radius: 6px;
            text-align: center;
        }
        .stat-box span {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .stat-box strong {
            font-size: 1.1rem;
            color: var(--accent-green);
        }
        .wheel-container {
            text-align: center;
            margin: 10px 0;
        }
        .wheel {
            width: 70px;
            height: 70px;
            border: 4px dashed var(--accent-green);
            border-radius: 50%;
            margin: 0 auto;
            animation: spin 2s linear infinite;
            animation-play-state: paused;
        }
        .wheel.active {
            animation-play-state: running;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .control-group {
            margin-bottom: 15px;
            background: rgba(31, 41, 55, 0.3);
            padding: 10px;
            border-radius: 6px;
        }
        .control-group label {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: block;
            margin-bottom: 5px;
        }
        .control-group input[type="range"] {
            width: 100%;
            accent-color: var(--accent-green);
        }
        button {
            background-color: var(--accent-green);
            color: #000;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            border-radius: 6px;
            font-size: 0.95rem;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #059669;
            color: #fff;
        }
        .history-box {
            margin-top: 15px;
            font-size: 0.8rem;
            max-height: 100px;
            overflow-y: auto;
            border-top: 1px solid var(--border-color);
            padding-top: 8px;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
            padding: 3px 0;
            border-bottom: 1px dashed rgba(255,255,255,0.05);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Squeekchain Companion</h1>
        <p>Advanced Telemetry & Speed Controller v2.0</p>
    </div>

    <div class="dashboard">
        <div class="card">
            <div class="wheel-container">
                <div id="wheel" class="wheel"></div>
                <p id="wheel-status" style="font-size: 0.8rem; color: var(--text-muted); margin-top: 8px;">Status: Standby</p>
            </div>

            <div class="stats-grid">
                <div class="stat-box">
                    <span>Wheel Distance</span>
                    <strong id="dist-val">0.00 m</strong>
                </div>
                <div class="stat-box">
                    <span>AI Efficiency</span>
                    <strong id="eff-val">0.0%</strong>
                </div>
                <div class="stat-box">
                    <span>Target Block</span>
                    <strong id="block-val">#----</strong>
                </div>
                <div class="stat-box">
                    <span>Yield Rate</span>
                    <strong id="yield-val">0.00 SQK</strong>
                </div>
            </div>

            <div class="control-group">
                <label for="speedSlider">Hamster RPM Speed Control: <span id="speedVal">50</span> RPM</label>
                <input type="range" id="speedSlider" min="10" max="150" value="50" oninput="updateSpeed(this.value)">
            </div>

            <button onclick="runSimulation()">Execute AI Simulation Run</button>

            <div class="history-box" id="historyList">
                <div style="color: var(--accent-green); margin-bottom: 4px;">Recent Telemetry History:</div>
                <div class="history-item"><span>Initialized session</span><span>--</span></div>
            </div>
        </div>
    </div>

    <script>
        let isRunning = false;

        function updateSpeed(val) {
            document.getElementById('speedVal').innerText = val;
            const wheel = document.getElementById('wheel');
            // गति के आधार पर एनिमेशन की स्पीड बदलना
            let animSpeed = (160 - val) / 50; 
            wheel.style.animationDuration = animSpeed + 's';
        }

        function runSimulation() {
            if (isRunning) return;
            isRunning = true;

            const wheel = document.getElementById('wheel');
            const wheelStatus = document.getElementById('wheel-status');
            const speed = document.getElementById('speedSlider').value;
            
            wheel.classList.add('active');
            wheelStatus.innerText = "Status: Processing at " + speed + " RPM...";

            let step = 0;
            const interval = setInterval(() => {
                step += 25;
                let currentDist = (Math.random() * 20 + (step * (speed/30))).toFixed(2);
                let currentEff = (Math.random() * 4 + 94).toFixed(1);

                document.getElementById('dist-val').innerText = currentDist + " m";
                document.getElementById('eff-val').innerText = currentEff + "%";

                if (step >= 100) {
                    clearInterval(interval);
                    wheel.classList.remove('active');
                    wheelStatus.innerText = "Status: Cycle Finished Successfully";

                    const blockNum = Math.floor(Math.random() * 899999 + 100000);
                    const yieldAmt = (Math.random() * 2.5 + 1.1).toFixed(2);

                    document.getElementById('block-val').innerText = "#" + blockNum;
                    document.getElementById('yield-val').innerText = yieldAmt + " SQK";

                    // हिस्ट्री में जोड़ना
                    const historyList = document.getElementById('historyList');
                    const timeNow = new Date().toLocaleTimeString();
                    historyList.innerHTML += `<div class="history-item"><span>Block #${blockNum} (${currentDist}m)</span><span>${yieldAmt} SQK</span></div>`;
                    historyList.scrollTop = historyList.scrollHeight;

                    isRunning = false;
                }
            }, 250);
        }
    </script>
</body>
</html>
