    <!-- Tailwind CSS for UI overlay styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Retro Arcade & Pixel Art Font Styles */
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

        body {
            background-color: #050508;
            color: #00ffcc;
            font-family: 'VT323', monospace;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .arcade-font {
            font-family: 'Press Start 2P', cursive;
        }

        /* Scanline effect over canvas */

        /* CRT Screen Glow border */

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 15px rgba(0,255,204,0.4); }

</head>
<body class="h-screen w-screen flex flex-col justify-between items-center p-2 md:p-4 bg-slate-950">

    <!-- Top Navigation & Web3 Bar -->
    <header class="w-full max-w-4xl flex justify-between items-center bg-slate-900/90 border border-emerald-500/30 p-3 rounded-lg z-20 backdrop-blur-md">
        <div class="flex items-center gap-2">

            </div>

        </div>

        <!-- Web3 Wallet Connection Button -->
        <button id="walletBtn" onclick="connectWallet()" class="arcade-font text-xs bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold py-2 px-3 md:px-4 rounded transition-all duration-200 border-b-4 border-emerald-800 active:border-b-0 active:translate-y-1">
            CONNECT WALLET
        </button>
    </header>

    <!-- Game Container with CRT & Scanlines -->
    <div class="relative w-full max-w-4xl flex-1 my-2 rounded-xl overflow-hidden crt-container bg-black flex justify-center items-center">

        <canvas id="gameCanvas" class="w-full h-full block"></canvas>

        <!-- Start / Game Over Overlay -->
        <div id="uiOverlay" class="absolute inset-0 bg-slate-950/85 z-20 flex flex-col justify-center items-center text-center p-6">

            <div id="scoreSummary" class="hidden mb-6 bg-slate-900 border border-emerald-500/40 p-4 rounded-lg w-64">
                <p class="text-slate-400 text-sm">DISTANCE: <span id="finalDistance" class="text-emerald-400 font-bold">0m</span></p>
                <p class="text-slate-400 text-sm">SQK COLLECTED: <span id="finalTokens" class="text-yellow-400 font-bold">0</span></p>
                <p class="text-slate-400 text-sm">FINAL SCORE: <span id="finalScore" class="text-cyan-400 font-bold">0</span></p>
            </div>

            <button id="startBtn" onclick="startGame()" class="arcade-font text-sm md:text-base bg-emerald-400 text-slate-950 font-bold py-3 px-8 rounded-lg border-b-4 border-emerald-700 hover:bg-emerald-300 transition-all btn-glow">
                START RUN
            </button>

    </div>

    <!-- On-Screen Touch Controls for Mobile -->
    <div class="w-full max-w-4xl flex gap-2 md:hidden z-20 pb-1">
        <button id="mobileJumpBtn" class="w-full bg-slate-800 border-2 border-emerald-500/50 text-emerald-400 font-bold py-3 rounded-lg text-lg active:bg-emerald-900/50">
            TAP / JUMP 🚀
        </button>
    </div>

    <!-- Web Audio API Sound Synthesizer & Game Engine Script -->
    <script>
        // --- WEB AUDIO API (SYNTHESIZER) ---
        class SoundEffects {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playJump() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.15);
                
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            }

            playCoin() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(800, this.ctx.currentTime);
                osc.frequency.setValueAtTime(1200, this.ctx.currentTime + 0.08);

                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
            }

            playHit() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.3);

                gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }
        }

        const sounds = new SoundEffects();

        // --- WEB3 WALLET INTEGRATION ---
        let userAddress = null;

        async function connectWallet() {
            const btn = document.getElementById('walletBtn');
            if (window.ethereum) {
                try {
                    btn.innerText = 'CONNECTING...';
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    userAddress = accounts[0];
                    const shortAddr = userAddress.slice(0, 4) + '...' + userAddress.slice(-4);
                    btn.innerText = shortAddr;
                    btn.classList.remove('bg-emerald-600', 'hover:bg-emerald-500');
                    btn.classList.add('bg-slate-800', 'text-emerald-400', 'border-emerald-500');
                } catch (err) {
                    console.error("Wallet connection failed", err);
                    btn.innerText = 'CONNECT WALLET';
                }
            } else {
                alert('MetaMask or Web3 wallet not detected in browser.');
                btn.innerText = 'NO WALLET';
            }
        }

        // --- GAME ENGINE ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let isRunning = false;
        let animationFrameId = null;

        // Resize Canvas dynamically
        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Game Variables
        let wheelAngle = 0;
        let wheelSpeed = 0.02;
        let distance = 0;
        let sqkTokens = 0;
        let energy = 100;
        let highScore = localStorage.getItem('sqk_highscore') || 0;

        // Player (Hamster) Object
        const hamster = {
            x: 0,
            y: 0,
            radius: 18,
            jumpForce: 12,
            vy: 0,
            gravity: 0.6,
            isGrounded: true,
            baseY: 0,
            frame: 0,
            animTimer: 0
        };

        // Entities arrays
        let obstacles = [];
        let tokens = [];

        function initGame() {
            wheelSpeed = 0.02;
            distance = 0;
            sqkTokens = 0;
            energy = 100;
            obstacles = [];
            tokens = [];

            // Position Hamster near bottom of wheel
            hamster.baseY = canvas.height / 2 + canvas.height * 0.32;
            hamster.x = canvas.width / 2 - 30;
            hamster.y = hamster.baseY;
            hamster.vy = 0;
            hamster.isGrounded = true;
        }

        function triggerJump() {
            sounds.init();
            if (hamster.isGrounded && isRunning) {
                hamster.vy = -hamster.jumpForce;
                hamster.isGrounded = false;
                sounds.playJump();
            }
        }

        // Input Listeners
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                triggerJump();
            }
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            triggerJump();
        });

        document.getElementById('mobileJumpBtn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            triggerJump();
        });

        // Spawn Spikes or Blocks
        function spawnObstacle() {
            if (Math.random() < 0.025) {
                obstacles.push({
                    angle: Math.PI / 2 + 0.8, // Spawn ahead on the wheel
                    size: 20 + Math.random() * 10
                });
            }
        }

        // Spawn SQK Tokens
        function spawnToken() {
            if (Math.random() < 0.035) {
                tokens.push({
                    angle: Math.PI / 2 + 1.0,
                    radiusOffset: 30 + Math.random() * 40
                });
            }
        }

        // Main Game Loop
        function gameLoop() {
            if (!isRunning) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Wheel Geometry
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const wheelRadius = Math.min(canvas.width, canvas.height) * 0.42;

            // Update Physics & Environment
            wheelAngle += wheelSpeed;
            distance += Math.floor(wheelSpeed * 10);
            energy = Math.max(0, energy - 0.03); // Energy slowly drops

            // Difficulty adjustment over time
            wheelSpeed += 0.000005;

            // Hamster Gravity & Jumping
            hamster.vy += hamster.gravity;
            hamster.y += hamster.vy;

            const groundLevel = centerY + wheelRadius - 25;
            if (hamster.y >= groundLevel) {
                hamster.y = groundLevel;
                hamster.vy = 0;
                hamster.isGrounded = true;
            }

            // Hamster Animation frame
            hamster.animTimer++;
            if (hamster.animTimer % 6 === 0) {
                hamster.frame = (hamster.frame + 1) % 4;
            }

            // --- DRAW ROTATING HAMSTER WHEEL ---
            ctx.save();
            ctx.translate(centerX, centerY);

            // Outer Wheel Rim
            ctx.beginPath();
            ctx.arc(0, 0, wheelRadius, 0, Math.PI * 2);
            ctx.strokeStyle = '#00ffcc';
            ctx.lineWidth = 6;
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00ffcc';
            ctx.stroke();

            // Inner Tread
            ctx.beginPath();
            ctx.arc(0, 0, wheelRadius - 10, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.3)';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Spokes
            const numSpokes = 12;
            for (let i = 0; i < numSpokes; i++) {
                const angle = wheelAngle + (i * Math.PI * 2) / numSpokes;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(Math.cos(angle) * (wheelRadius - 10), Math.sin(angle) * (wheelRadius - 10));
                ctx.strokeStyle = 'rgba(0, 255, 204, 0.2)';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            ctx.restore();

            // --- SPAWN & UPDATE OBSTACLES ---
            spawnObstacle();
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.angle -= wheelSpeed; // Moves relative to rotating wheel

                // Calculate screen position
                const obsX = centerX + Math.cos(obs.angle) * (wheelRadius - 15);
                const obsY = centerY + Math.sin(obs.angle) * (wheelRadius - 15);

                // Draw Red Energy Obstacle
                ctx.fillStyle = '#ff0055';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ff0055';
                ctx.beginPath();
                ctx.arc(obsX, obsY, obs.size / 2, 0, Math.PI * 2);
                ctx.fill();

                // Collision Detection with Hamster
                const distToHamster = Math.hypot(obsX - hamster.x, obsY - hamster.y);
                if (distToHamster < hamster.radius + obs.size / 2) {
                    sounds.playHit();
                    energy -= 25; // Lose energy on hit
                    obstacles.splice(i, 1);
                    if (energy <= 0) gameOver();
                } else if (obs.angle < Math.PI / 2 - 0.8) {
                    // Remove when off-screen
                    obstacles.splice(i, 1);
                }
            }

            // --- SPAWN & UPDATE SQK TOKENS ---
            spawnToken();
            for (let i = tokens.length - 1; i >= 0; i--) {
                const tok = tokens[i];
                tok.angle -= wheelSpeed;

                const tokX = centerX + Math.cos(tok.angle) * (wheelRadius - tok.radiusOffset);
                const tokY = centerY + Math.sin(tok.angle) * (wheelRadius - tok.radiusOffset);

                // Draw Glowing Yellow Token
                ctx.fillStyle = '#ffd700';
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#ffd700';
                ctx.beginPath();
                ctx.arc(tokX, tokY, 8, 0, Math.PI * 2);
                ctx.fill();

                // Token symbol $
                ctx.fillStyle = '#000';
                ctx.font = '10px monospace';
                ctx.fillText('S', tokX - 3, tokY + 3);

                // Collision Detection with Token
                const distToToken = Math.hypot(tokX - hamster.x, tokY - hamster.y);
                if (distToToken < hamster.radius + 10) {
                    sounds.playCoin();
                    sqkTokens += 1;
                    energy = Math.min(100, energy + 5); // Token restores energy
                    tokens.splice(i, 1);
                } else if (tok.angle < Math.PI / 2 - 0.8) {
                    tokens.splice(i, 1);
                }
            }

            // --- DRAW HAMSTER CHARACTER ---
            ctx.save();
            ctx.translate(hamster.x, hamster.y);

            // Hamster Body
            ctx.fillStyle = '#ffaa00';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ffaa00';
            ctx.beginPath();
            ctx.arc(0, 0, hamster.radius, 0, Math.PI * 2);
            ctx.fill();

            // Hamster Ear
            ctx.fillStyle = '#ff77aa';
            ctx.beginPath();
            ctx.arc(-8, -12, 5, 0, Math.PI * 2);
            ctx.fill();

            // Eye
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(6, -4, 3, 0, Math.PI * 2);
            ctx.fill();

            // Animated Running Feet
            const legOffset = Math.sin(hamster.animTimer * 0.5) * 6;
            ctx.strokeStyle = '#d47a00';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(-6, 12);
            ctx.lineTo(-6 + legOffset, 18);
            ctx.moveTo(6, 12);
            ctx.lineTo(6 - legOffset, 18);
            ctx.stroke();

            ctx.restore();

            // --- DRAW HUD (HEADS UP DISPLAY) ---
            ctx.shadowBlur = 0;
            ctx.font = '16px "VT323", monospace';
            ctx.fillStyle = '#00ffcc';
            ctx.fillText(`DISTANCE: ${distance}m`, 20, 30);

            ctx.fillStyle = '#ffd700';
            ctx.fillText(`$SQK: ${sqkTokens}`, 20, 55);

            // Energy Bar
            ctx.fillStyle = '#888';
            ctx.fillRect(20, 70, 120, 10);
            ctx.fillStyle = energy > 30 ? '#00ffcc' : '#ff0055';
            ctx.fillRect(20, 70, (energy / 100) * 120, 10);

            if (energy <= 0) {
                gameOver();
            } else {
                animationFrameId = requestAnimationFrame(gameLoop);
            }
        }

        // Start Game Handler
        function startGame() {
            sounds.init();
            initGame();
            document.getElementById('uiOverlay').classList.add('hidden');
            isRunning = true;
            gameLoop();
        }

        // Game Over Handler
        function gameOver() {
            isRunning = false;
            cancelAnimationFrame(animationFrameId);

            const totalScore = distance + (sqkTokens * 50);
            if (totalScore > highScore) {
                highScore = totalScore;
                localStorage.setItem('sqk_highscore', highScore);
            }

            document.getElementById('overlayTitle').innerText = 'RUN OVER!';
            document.getElementById('overlayDesc').innerText = 'Your hamster exhausted its energy on the wheel.';
            document.getElementById('finalDistance').innerText = `${distance}m`;
            document.getElementById('finalTokens').innerText = sqkTokens;
            document.getElementById('finalScore').innerText = totalScore;
            
            document.getElementById('scoreSummary').classList.remove('hidden');
            document.getElementById('startBtn').innerText = 'TRY AGAIN';
            document.getElementById('uiOverlay').classList.remove('hidden');
        }
    </script>
</body>
</html>
