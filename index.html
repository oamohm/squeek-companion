<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Squeekchain Genesis Companion - Wheel Protocol Runner</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap');

        :root {
            --bg-base: #03060d;
            --bg-panel: rgba(13, 22, 38, 0.95);
            --bg-card: rgba(20, 32, 54, 0.95);
            --primary: #00ffcc;
            --primary-glow: rgba(0, 255, 204, 0.4);
            --secondary: #ff007a;
            --secondary-glow: rgba(255, 0, 122, 0.4);
            --accent-gold: #ffd700;
            --text-bright: #ffffff;
            --text-muted: #8fa0b5;
            --text-dark: #4a5c70;
            --border-glow: 0 0 15px rgba(0, 255, 204, 0.25);
            --font-pixel: 'Press Start 2P', monospace;
            --font-mono: 'Share Tech Mono', monospace;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100vh;
            background-color: var(--bg-base);
            color: var(--primary);
            font-family: var(--font-pixel);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-root {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100vh;
            max-width: 480px;
            max-height: 850px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px;
            background: var(--bg-panel);
            border: 2px solid var(--primary);
            box-shadow: var(--border-glow);
        }

        header.arcade-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            background: var(--bg-card);
            border: 1px solid var(--primary);
            border-radius: 6px;
            flex-shrink: 0;
        }

        .branding-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .branding-avatar {
            width: 20px;
            height: 20px;
            background: #ffb703;
            border-radius: 50%;
            border: 2px solid var(--primary);
        }

        .branding-text {
            display: flex;
            flex-direction: column;
        }

        .branding-text .main-title {
            font-size: 8px;
            color: var(--text-bright);
            text-shadow: 0 0 4px var(--primary);
        }

        .branding-text .sub-title {
            font-size: 5px;
            color: var(--text-muted);
            font-family: var(--font-mono);
            margin-top: 1px;
        }

        .btn-web3 {
            background: linear-gradient(135deg, #ff007a, #990049);
            color: var(--text-bright);
            border: 1px solid #ff55a3;
            padding: 6px 10px;
            font-family: var(--font-pixel);
            font-size: 7px;
            cursor: pointer;
            border-radius: 4px;
            box-shadow: var(--secondary-glow);
        }

        .viewport-wrapper {
            position: relative;
            width: 100%;
            flex: 1 1 auto;
            margin: 8px 0;
            background: #000000;
            border: 2px solid var(--primary);
            border-radius: 6px;
            overflow: hidden;
            min-height: 200px;
        }

        canvas#viewportCanvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        .dashboard-container {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            flex-shrink: 0;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid rgba(0, 255, 204, 0.2);
            padding: 6px 2px;
            border-radius: 4px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .stat-card .label {
            font-size: 5px;
            color: var(--text-muted);
            font-family: var(--font-mono);
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .stat-card .val {
            font-size: 7px;
            color: var(--primary);
            font-family: var(--font-pixel);
            word-break: break-all;
        }

        footer.arcade-footer {
            width: 100%;
            text-align: center;
            font-size: 6px;
            color: var(--text-muted);
            font-family: var(--font-mono);
            margin-top: 6px;
            flex-shrink: 0;
            line-height: 1.2;
        }

        @media (min-width: 768px) {
            .app-root {
                height: 90vh;
                max-height: 750px;
                border-radius: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="app-root">
        <header class="arcade-header">
            <div class="branding-group">
                <div class="branding-avatar"></div>
                <div class="branding-text">
                    <span class="main-title">SQUEEKCHAIN</span>
                    <span class="sub-title">WHEEL RUNNER v3.0</span>
                </div>
            </div>
            <button class="btn-web3" id="walletConnectBtn">CONNECT WALLET</button>
        </header>

        <div class="viewport-wrapper" id="viewportWrapper">
            <canvas id="viewportCanvas"></canvas>
        </div>

        <div class="dashboard-container">
            <div class="stat-card">
                <div class="label">STAGE</div>
                <div class="val" id="hudStage">1: CYBER</div>
            </div>
            <div class="stat-card">
                <div class="label">DISTANCE</div>
                <div class="val" id="hudDist">0m</div>
            </div>
            <div class="stat-card">
                <div class="label">ENERGY</div>
                <div class="val" id="hudEnergy">100%</div>
            </div>
            <div class="stat-card">
                <div class="label">$SQK TOKEN</div>
                <div class="val" id="hudTokens" style="color: var(--accent-gold);">0</div>
            </div>
        </div>

        <footer class="arcade-footer">
            DETERMINISTIC EXECUTION • TAP TO JUMP
        </footer>
    </div>

    <script>
        class AudioEngine {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playTone(freq, type = 'sine', duration = 0.1, volume = 0.1) {
                if (this.muted) return;
                try {
                    this.init();
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(volume, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch (e) {}
            }

            playJumpSound() {
                this.playTone(350, 'sine', 0.12, 0.08);
                setTimeout(() => this.playTone(520, 'sine', 0.15, 0.06), 40);
            }

            playCoinSound() {
                this.playTone(880, 'square', 0.08, 0.05);
                setTimeout(() => this.playTone(1320, 'square', 0.12, 0.05), 60);
            }

            playHitSound() {
                this.playTone(120, 'sawtooth', 0.25, 0.15);
            }

            playGameOverSound() {
                this.playTone(300, 'sawtooth', 0.2, 0.1);
                setTimeout(() => this.playTone(200, 'sawtooth', 0.2, 0.1), 150);
                setTimeout(() => this.playTone(100, 'sawtooth', 0.4, 0.1), 300);
            }
        }

        class Web3Connector {
            constructor(uiCallback) {
                this.address = null;
                this.balance = 1250;
                this.isConnected = false;
                this.uiCallback = uiCallback;
                this.initBtn();
            }

            initBtn() {
                const btn = document.getElementById('walletConnectBtn');
                btn.addEventListener('click', () => this.connect());
            }

            async connect() {
                if (window.ethereum) {
                    try {
                        const accs = await window.ethereum.request({ method: 'eth_requestAccounts' });
                        this.address = accs[0];
                        this.isConnected = true;
                        this.updateBtn();
                        if (this.uiCallback) this.uiCallback(this);
                    } catch (e) {}
                } else {
                    this.address = "0x" + Array.from({length: 40}, () => Math.floor(Math.random()*16).toString(16)).join('');
                    this.isConnected = true;
                    this.updateBtn();
                    if (this.uiCallback) this.uiCallback(this);
                }
            }

            updateBtn() {
                const btn = document.getElementById('walletConnectBtn');
                if (this.isConnected && this.address) {
                    btn.innerText = `${this.address.substring(0, 4)}...${this.address.substring(38)}`;
                    btn.style.background = "linear-gradient(135deg, #00ffcc, #008866)";
                    btn.style.color = "#000";
                    btn.style.border = "1px solid #00ffcc";
                }
            }
        }

        class SqueekGameEngine {
            constructor() {
                this.canvas = document.getElementById('viewportCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.wrapper = document.getElementById('viewportWrapper');

                this.audio = new AudioEngine();
                this.web3 = new Web3Connector(() => this.syncHUD());

                this.state = "START";
                this.distance = 0;
                this.coinsCollected = 0;
                this.energy = 100;
                this.stage = 1;
                this.frame = 0;
                this.wheelAngle = 0;

                this.hamster = {
                    x: 0,
                    y: 0,
                    vy: 0,
                    radius: 11,
                    grounded: true
                };

                this.obstacles = [];
                this.coins = [];
                this.particles = [];

                this.initEventListeners();
                this.resizeCanvas();
                this.loop = this.loop.bind(this);
                requestAnimationFrame(loop => this.loop(loop));
            }

            initEventListeners() {
                window.addEventListener('resize', () => this.resizeCanvas());

                const triggerJump = (e) => {
                    if (e.target.tagName === 'BUTTON') return;
                    if (e.type === 'touchstart') e.preventDefault();
                    
                    this.audio.init();

                    if (this.state === "START" || this.state === "GAMEOVER") {
                        this.resetGame();
                        this.state = "PLAYING";
                    } else if (this.state === "PLAYING" && this.hamster.grounded) {
                        this.hamster.vy = -this.canvas.height * 0.021;
                        this.hamster.grounded = false;
                        this.audio.playJumpSound();
                    }
                };

                window.addEventListener('keydown', (e) => { if (e.code === 'Space') triggerJump(e); });
                this.wrapper.addEventListener('touchstart', triggerJump, { passive: false });
                this.wrapper.addEventListener('click', triggerJump);
            }

            resizeCanvas() {
                this.canvas.width = this.wrapper.clientWidth;
                this.canvas.height = this.wrapper.clientHeight;
            }

            resetGame() {
                this.distance = 0;
                this.coinsCollected = 0;
                this.energy = 100;
                this.stage = 1;
                this.frame = 0;
                this.wheelAngle = 0;
                this.hamster.vy = 0;
                this.obstacles = [];
                this.coins = [];
                this.particles = [];
                this.syncHUD();
            }

            syncHUD() {
                document.getElementById('hudDist').innerText = `${Math.floor(this.distance)}m`;
                document.getElementById('hudEnergy').innerText = `${Math.max(0, Math.floor(this.energy))}%`;
                
                const totalSQK = (this.web3.balance + (this.coinsCollected * 10));
                document.getElementById('hudTokens').innerText = totalSQK;

                if (this.distance < 100) {
                    this.stage = 1;
                    document.getElementById('hudStage').innerText = "1: CYBER";
                    document.getElementById('hudStage').style.color = "#00ffcc";
                } else if (this.distance < 250) {
                    this.stage = 2;
                    document.getElementById('hudStage').innerText = "2: WHEEL";
                    document.getElementById('hudStage').style.color = "#ffd700";
                } else {
                    this.stage = 3;
                    document.getElementById('hudStage').innerText = "3: CORE";
                    document.getElementById('hudStage').style.color = "#ff007a";
                }
            }

            spawnParticles(x, y, color) {
                for (let i = 0; i < 5; i++) {
                    this.particles.push({
                        x: x,
                        y: y,
                        vx: (Math.random() - 0.5) * 4,
                        vy: (Math.random() - 0.5) * 4,
                        radius: Math.random() * 2.5 + 1,
                        color: color,
                        life: 18
                    });
                }
            }

            update() {
                if (this.state !== "PLAYING") return;

                this.frame++;
                this.distance += 0.12;
                this.energy -= 0.022;
                this.wheelAngle += 0.04 + (this.stage * 0.005);

                if (this.energy <= 0) {
                    this.state = "GAMEOVER";
                    this.audio.playGameOverSound();
                }

                const centerX = this.canvas.width / 2;
                const centerY = this.canvas.height / 2;
                const wheelRadius = Math.min(this.canvas.width, this.canvas.height) * 0.42;
                const groundY = centerY + wheelRadius - 14;

                this.hamster.x = centerX - (wheelRadius * 0.55);

                this.hamster.vy += this.canvas.height * 0.00095;
                this.hamster.y += this.hamster.vy;

                if (this.hamster.y >= groundY) {
                    this.hamster.y = groundY;
                    this.hamster.vy = 0;
                    this.hamster.grounded = true;
                }

                const obstacleInterval = Math.max(50, 90 - (this.stage * 10));
                if (this.frame % obstacleInterval === 0) {
                    this.obstacles.push({
                        x: this.canvas.width + 20,
                        size: 14 + Math.random() * 6
                    });
                }

                if (this.frame % 105 === 0) {
                    this.coins.push({
                        x: this.canvas.width + 20,
                        y: groundY - (Math.random() * 45 + 20)
                    });
                }

                const moveSpeed = 3.2 + (this.stage * 0.5);

                this.obstacles.forEach((obs, idx) => {
                    obs.x -= moveSpeed;
                    if (Math.abs(obs.x - this.hamster.x) < 16 && this.hamster.y >= groundY - 8) {
                        this.energy -= 18;
                        this.audio.playHitSound();
                        this.spawnParticles(this.hamster.x, this.hamster.y, "#ff007a");
                        this.obstacles.splice(idx, 1);
                    }
                });

                this.coins.forEach((coin, idx) => {
                    coin.x -= moveSpeed;
                    if (Math.abs(coin.x - this.hamster.x) < 18 && Math.abs(coin.y - this.hamster.y) < 18) {
                        this.coinsCollected++;
                        this.energy = Math.min(100, this.energy + 10);
                        this.audio.playCoinSound();
                        this.spawnParticles(coin.x, coin.y, "#ffd700");
                        this.coins.splice(idx, 1);
                    }
                });

                this.particles.forEach((p) => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life--;
                });

                this.obstacles = this.obstacles.filter(o => o.x > -30);
                this.coins = this.coins.filter(c => c.x > -30);
                this.particles = this.particles.filter(p => p.life > 0);

                this.syncHUD();
            }

            draw() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                const centerX = this.canvas.width / 2;
                const centerY = this.canvas.height / 2;
                const wheelRadius = Math.min(this.canvas.width, this.canvas.height) * 0.42;

                let themeColor = "#00ffcc";
                if (this.stage === 2) themeColor = "#ffd700";
                if (this.stage === 3) themeColor = "#ff007a";

                this.ctx.strokeStyle = themeColor;
                this.ctx.lineWidth = 3;
                this.ctx.beginPath();
                this.ctx.arc(centerX, centerY, wheelRadius, 0, Math.PI * 2);
                this.ctx.stroke();

                for (let i = 0; i < 8; i++) {
                    let ang = this.wheelAngle + (i * Math.PI / 4);
                    this.ctx.strokeStyle = "rgba(22, 43, 66, 0.6)";
                    this.ctx.lineWidth = 2;
                    this.ctx.beginPath();
                    this.ctx.moveTo(centerX, centerY);
                    this.ctx.lineTo(centerX + Math.cos(ang) * wheelRadius, centerY + Math.sin(ang) * wheelRadius);
                    this.ctx.stroke();
                }

                this.ctx.strokeStyle = "#ff007a";
                this.ctx.lineWidth = 4;
                this.ctx.beginPath();
                this.ctx.arc(centerX, centerY, wheelRadius - 5, 0.22 * Math.PI, 0.78 * Math.PI);
                this.ctx.stroke();

                const groundY = centerY + wheelRadius - 14;

                if (this.state === "PLAYING") {
                    this.ctx.fillStyle = "#ff0055";
                    this.obstacles.forEach(obs => {
                        this.ctx.fillRect(obs.x, groundY - obs.size, obs.size, obs.size);
                    });

                    this.ctx.fillStyle = "#ffd700";
                    this.coins.forEach(c => {
                        this.ctx.beginPath();
                        this.ctx.arc(c.x, c.y, 5, 0, Math.PI * 2);
                        this.ctx.fill();
                    });

                    this.particles.forEach(p => {
                        this.ctx.fillStyle = p.color;
                        this.ctx.beginPath();
                        this.ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                        this.ctx.fill();
                    });

                    this.ctx.fillStyle = "#ffb703";
                    this.ctx.beginPath();
                    this.ctx.arc(this.hamster.x, this.hamster.y, this.hamster.radius, 0, Math.PI * 2);
                    this.ctx.fill();

                    this.ctx.fillStyle = "#fb8500";
                    this.ctx.beginPath();
                    this.ctx.arc(this.hamster.x - 3, this.hamster.y - 8, 2.5, 0, Math.PI * 2);
                    this.ctx.arc(this.hamster.x + 3, this.hamster.y - 8, 2.5, 0, Math.PI * 2);
                    this.ctx.fill();
                } else if (this.state === "START") {
                    this.ctx.fillStyle = "#ffffff";
                    this.ctx.font = "9px 'Press Start 2P'";
                    this.ctx.textAlign = "center";
                    this.ctx.fillText("TAP TO START", centerX, centerY - 10);

                    this.ctx.fillStyle = themeColor;
                    this.ctx.font = "6px 'Press Start 2P'";
                    this.ctx.fillText("RUN & MINT $SQK TOKENS", centerX, centerY + 14);
                } else if (this.state === "GAMEOVER") {
                    this.ctx.fillStyle = "#ff007a";
                    this.ctx.font = "11px 'Press Start 2P'";
                    this.ctx.textAlign = "center";
                    this.ctx.fillText("RUN OVER!", centerX, centerY - 18);

                    this.ctx.fillStyle = "#ffffff";
                    this.ctx.font = "6px 'Press Start 2P'";
                    this.ctx.fillText(`DIST: ${Math.floor(this.distance)}m | EARNED: +${this.coinsCollected * 10} SQK`, centerX, centerY + 4);
                    this.ctx.fillText("TAP TO RESTART", centerX, centerY + 22);
                }
            }

            loop() {
                this.update();
                this.draw();
                requestAnimationFrame(() => this.loop());
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            window.gameInstance = new SqueekGameEngine();
        });
    </script>
</body>
</html>
