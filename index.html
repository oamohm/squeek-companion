<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Squeekchain Genesis Companion - Wheel Protocol Runner</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap');

        :root {
            --bg-base: #03060d;
            --bg-panel: #0d1626;
            --bg-card: #142036;
            --primary: #00ffcc;
            --secondary: #ff007a;
            --accent-gold: #ffd700;
            --text-bright: #ffffff;
            --text-muted: #8fa0b5;
            --border-glow: 0 0 15px rgba(0, 255, 204, 0.25);
            --font-pixel: 'Press Start 2P', monospace;
            --font-mono: 'Share Tech Mono', monospace;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-base);
            color: var(--primary);
            font-family: var(--font-pixel);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-root {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px;
            background: var(--bg-panel);
            border: 2px solid var(--primary);
            box-shadow: var(--border-glow);
        }

        header.arcade-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: var(--bg-card);
            border: 1px solid var(--primary);
            border-radius: 6px;
            flex-shrink: 0;
        }

        .branding-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .branding-avatar {
            width: 22px;
            height: 22px;
            background: #ffb703;
            border-radius: 50%;
            border: 2px solid var(--primary);
            box-shadow: 0 0 8px #ffb703;
        }

        .branding-text {
            display: flex;
            flex-direction: column;
        }

        .branding-text .main-title {
            font-size: 10px;
            color: var(--text-bright);
            text-shadow: 0 0 5px var(--primary);
        }

        .branding-text .sub-title {
            font-size: 6px;
            color: var(--text-muted);
            font-family: var(--font-mono);
            margin-top: 2px;
        }

        .btn-web3 {
            background: linear-gradient(135deg, #ff007a, #990049);
            color: var(--text-bright);
            border: 1px solid #ff55a3;
            padding: 8px 12px;
            font-family: var(--font-pixel);
            font-size: 8px;
            cursor: pointer;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(255, 0, 122, 0.4);
            transition: transform 0.1s;
        }

        .btn-web3:active {
            transform: scale(0.96);
        }

        .viewport-wrapper {
            position: relative;
            width: 100%;
            flex: 1 1 auto;
            margin: 8px 0;
            background: #000000;
            border: 2px solid var(--primary);
            border-radius: 6px;
            overflow: hidden;
            box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.9);
        }

        canvas#viewportCanvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        .dashboard-container {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            flex-shrink: 0;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid rgba(0, 255, 204, 0.3);
            padding: 8px 4px;
            border-radius: 4px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .stat-card .label {
            font-size: 6px;
            color: var(--text-muted);
            font-family: var(--font-mono);
            text-transform: uppercase;
            margin-bottom: 3px;
        }

        .stat-card .val {
            font-size: 9px;
            color: var(--primary);
            font-family: var(--font-pixel);
            word-break: break-all;
        }

        footer.arcade-footer {
            width: 100%;
            text-align: center;
            font-size: 6px;
            color: var(--text-muted);
            font-family: var(--font-mono);
            margin-top: 6px;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <div class="app-root">
        <header class="arcade-header">
            <div class="branding-group">
                <div class="branding-avatar"></div>
                <div class="branding-text">
                    <span class="main-title">SQUEEKCHAIN</span>
                    <span class="sub-title">WHEEL PROTOCOL RUNNER v3.0</span>
                </div>
            </div>
            <button class="btn-web3" id="walletConnectBtn">CONNECT WALLET</button>
        </header>

        <div class="viewport-wrapper" id="viewportWrapper">
            <canvas id="viewportCanvas"></canvas>
        </div>

        <div class="dashboard-container">
            <div class="stat-card">
                <div class="label">STAGE</div>
                <div class="val" id="hudStage">1: CYBER</div>
            </div>
            <div class="stat-card">
                <div class="label">DISTANCE</div>
                <div class="val" id="hudDist">0m</div>
            </div>
            <div class="stat-card">
                <div class="label">ENERGY</div>
                <div class="val" id="hudEnergy">100%</div>
            </div>
            <div class="stat-card">
                <div class="label">$SQK TOKEN</div>
                <div class="val" id="hudTokens" style="color: var(--accent-gold);">1250</div>
            </div>
        </div>

        <footer class="arcade-footer">
            DETERMINISTIC EXECUTION LAYER • TAP OR SPACE TO JUMP
        </footer>
    </div>

    <script>
        /**
         * ====================================================================
         * SQUEEKCHAIN ENTERPRISE ARCADE ENGINE MODULES
         * ====================================================================
         */

        // Module 1: Web Audio Synthesizer Engine
        class AudioEngine {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContextClass();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }
            playTone(freq, type = 'sine', duration = 0.1, volume = 0.1) {
                try {
                    this.init();
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(volume, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch (e) {}
            }
            playJump() {
                this.playTone(320, 'sine', 0.1, 0.08);
                setTimeout(() => this.playTone(480, 'sine', 0.12, 0.06), 40);
            }
            playCoin() {
                this.playTone(880, 'square', 0.08, 0.05);
                setTimeout(() => this.playTone(1320, 'square', 0.12, 0.05), 50);
            }
            playHit() {
                this.playTone(130, 'sawtooth', 0.2, 0.12);
            }
            playOver() {
                this.playTone(300, 'sawtooth', 0.2, 0.1);
                setTimeout(() => this.playTone(180, 'sawtooth', 0.3, 0.1), 150);
            }
        }

        // Module 2: Web3 Wallet & State Bridge
        class Web3Bridge {
            constructor(callback) {
                this.address = null;
                this.baseBalance = 1250;
                this.callback = callback;
                document.getElementById('walletConnectBtn').addEventListener('click', () => this.connectWallet());
            }
            async connectWallet() {
                if (window.ethereum) {
                    try {
                        const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                        this.address = accounts[0];
                        this.updateUI();
                        if (this.callback) this.callback();
                    } catch (e) {}
                } else {
                    this.address = "0x" + Array.from({length: 40}, () => Math.floor(Math.random()*16).toString(16)).join('');
                    this.updateUI();
                    if (this.callback) this.callback();
                }
            }
            updateUI() {
                if (this.address) {
                    const btn = document.getElementById('walletConnectBtn');
                    btn.innerText = `${this.address.substring(0, 4)}...${this.address.substring(38)}`;
                    btn.style.background = "linear-gradient(135deg, #00ffcc, #008866)";
                    btn.style.color = "#03060d";
                }
            }
        }

        // Module 3: Core Game Canvas Engine
        class GameEngine {
            constructor() {
                this.canvas = document.getElementById('viewportCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.wrapper = document.getElementById('viewportWrapper');

                this.audio = new AudioEngine();
                this.web3 = new Web3Bridge(() => this.refreshHUD());

                this.state = "START"; // START, PLAYING, GAMEOVER
                this.distance = 0;
                this.coins = 0;
                this.energy = 100;
                this.stage = 1;
                this.frame = 0;
                this.wheelAngle = 0;

                this.hamster = { x: 0, y: 0, vy: 0, radius: 12, grounded: true };
                this.obstacles = [];
                this.tokens = [];
                this.particles = [];

                this.initListeners();
                this.resize();
                this.loop = this.loop.bind(this);
                requestAnimationFrame(this.loop);
            }

            initListeners() {
                window.addEventListener('resize', () => this.resize());

                const triggerAction = (e) => {
                    if (e.target.tagName === 'BUTTON') return;
                    if (e.type === 'touchstart') e.preventDefault();

                    this.audio.init();

                    if (this.state === "START" || this.state === "GAMEOVER") {
                        this.reset();
                        this.state = "PLAYING";
                    } else if (this.state === "PLAYING" && this.hamster.grounded) {
                        this.hamster.vy = -this.canvas.height * 0.022;
                        this.hamster.grounded = false;
                        this.audio.playJump();
                    }
                };

                window.addEventListener('keydown', (e) => { if (e.code === 'Space') triggerAction(e); });
                this.wrapper.addEventListener('touchstart', triggerAction, { passive: false });
                this.wrapper.addEventListener('click', triggerAction);
            }

            resize() {
                this.canvas.width = this.wrapper.clientWidth;
                this.canvas.height = this.wrapper.clientHeight;
            }

            reset() {
                this.distance = 0;
                this.coins = 0;
                this.energy = 100;
                this.stage = 1;
                this.frame = 0;
                this.wheelAngle = 0;
                this.hamster.vy = 0;
                this.obstacles = [];
                this.tokens = [];
                this.particles = [];
                this.refreshHUD();
            }

            refreshHUD() {
                document.getElementById('hudDist').innerText = `${Math.floor(this.distance)}m`;
                document.getElementById('hudEnergy').innerText = `${Math.max(0, Math.floor(this.energy))}%`;
                
                const totalTokens = this.web3.baseBalance + (this.coins * 10);
                document.getElementById('hudTokens').innerText = totalTokens;

                if (this.distance < 100) {
                    this.stage = 1;
                    document.getElementById('hudStage').innerText = "1: CYBER";
                    document.getElementById('hudStage').style.color = "#00ffcc";
                } else if (this.distance < 250) {
                    this.stage = 2;
                    document.getElementById('hudStage').innerText = "2: WHEEL";
                    document.getElementById('hudStage').style.color = "#ffd700";
                } else {
                    this.stage = 3;
                    document.getElementById('hudStage').innerText = "3: CORE";
                    document.getElementById('hudStage').style.color = "#ff007a";
                }
            }

            spawnFX(x, y, color) {
                for (let i = 0; i < 5; i++) {
                    this.particles.push({
                        x, y,
                        vx: (Math.random() - 0.5) * 5,
                        vy: (Math.random() - 0.5) * 5,
                        radius: Math.random() * 3 + 1,
                        color,
                        life: 15
                    });
                }
            }

            update() {
                if (this.state !== "PLAYING") return;

                this.frame++;
                this.distance += 0.12;
                this.energy -= 0.022;
                this.wheelAngle += 0.04 + (this.stage * 0.005);

                if (this.energy <= 0) {
                    this.state = "GAMEOVER";
                    this.audio.playOver();
                }

                const cx = this.canvas.width / 2;
                const cy = this.canvas.height / 2;
                const radius = Math.min(this.canvas.width, this.canvas.height) * 0.42;
                const groundY = cy + radius - 16;

                this.hamster.x = cx - (radius * 0.55);
                this.hamster.vy += this.canvas.height * 0.001;
                this.hamster.y += this.hamster.vy;

                if (this.hamster.y >= groundY) {
                    this.hamster.y = groundY;
                    this.hamster.vy = 0;
                    this.hamster.grounded = true;
                }

                const obsRate = Math.max(50, 90 - (this.stage * 10));
                if (this.frame % obsRate === 0) {
                    this.obstacles.push({ x: this.canvas.width + 20, size: 16 });
                }
                if (this.frame % 110 === 0) {
                    this.tokens.push({ x: this.canvas.width + 20, y: groundY - 45 });
                }

                const speed = 3.2 + (this.stage * 0.5);

                this.obstacles.forEach((obs, index) => {
                    obs.x -= speed;
                    if (Math.abs(obs.x - this.hamster.x) < 18 && this.hamster.y >= groundY - 8) {
                        this.energy -= 18;
                        this.audio.playHit();
                        this.spawnFX(this.hamster.x, this.hamster.y, "#ff007a");
                        this.obstacles.splice(index, 1);
                    }
                });

                this.tokens.forEach((coin, index) => {
                    coin.x -= speed;
                    if (Math.abs(coin.x - this.hamster.x) < 18 && Math.abs(coin.y - this.hamster.y) < 18) {
                        this.coins++;
                        this.energy = Math.min(100, this.energy + 12);
                        this.audio.playCoin();
                        this.spawnFX(coin.x, coin.y, "#ffd700");
                        this.tokens.splice(index, 1);
                    }
                });

                this.particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life--;
                });

                this.obstacles = this.obstacles.filter(o => o.x > -30);
                this.tokens = this.tokens.filter(c => c.x > -30);
                this.particles = this.particles.filter(p => p.life > 0);

                this.refreshHUD();
            }

            draw() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                const cx = this.canvas.width / 2;
                const cy = this.canvas.height / 2;
                const radius = Math.min(this.canvas.width, this.canvas.height) * 0.42;

                let colorTheme = "#00ffcc";
                if (this.stage === 2) colorTheme = "#ffd700";
                if (this.stage === 3) colorTheme = "#ff007a";

                // Wheel Ring
                this.ctx.strokeStyle = colorTheme;
                this.ctx.lineWidth = 3;
                this.ctx.beginPath();
                this.ctx.arc(cx, cy, radius, 0, Math.PI * 2);
                this.ctx.stroke();

                // Wheel Spokes
                for (let i = 0; i < 8; i++) {
                    let ang = this.wheelAngle + (i * Math.PI / 4);
                    this.ctx.strokeStyle = "rgba(22, 43, 66, 0.7)";
                    this.ctx.lineWidth = 2;
                    this.ctx.beginPath();
                    this.ctx.moveTo(cx, cy);
                    this.ctx.lineTo(cx + Math.cos(ang) * radius, cy + Math.sin(ang) * radius);
                    this.ctx.stroke();
                }

                // Track Arc
                this.ctx.strokeStyle = "#ff007a";
                this.ctx.lineWidth = 4;
                this.ctx.beginPath();
                this.ctx.arc(cx, cy, radius - 6, 0.22 * Math.PI, 0.78 * Math.PI);
                this.ctx.stroke();

                const groundY = cy + radius - 16;

                if (this.state === "PLAYING") {
                    this.ctx.fillStyle = "#ff0055";
                    this.obstacles.forEach(obs => {
                        this.ctx.fillRect(obs.x, groundY - obs.size, obs.size, obs.size);
                    });

                    this.ctx.fillStyle = "#ffd700";
                    this.tokens.forEach(c => {
                        this.ctx.beginPath();
                        this.ctx.arc(c.x, c.y, 6, 0, Math.PI * 2);
                        this.ctx.fill();
                    });

                    this.particles.forEach(p => {
                        this.ctx.fillStyle = p.color;
                        this.ctx.beginPath();
                        this.ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                        this.ctx.fill();
                    });

                    this.ctx.fillStyle = "#ffb703";
                    this.ctx.beginPath();
                    this.ctx.arc(this.hamster.x, this.hamster.y, this.hamster.radius, 0, Math.PI * 2);
                    this.ctx.fill();
                } else if (this.state === "START") {
                    this.ctx.fillStyle = "#ffffff";
                    this.ctx.font = "10px 'Press Start 2P'";
                    this.ctx.textAlign = "center";
                    this.ctx.fillText("TAP TO START", cx, cy - 10);

                    this.ctx.fillStyle = colorTheme;
                    this.ctx.font = "7px 'Press Start 2P'";
                    this.ctx.fillText("RUN & MINT $SQK TOKENS", cx, cy + 15);
                } else if (this.state === "GAMEOVER") {
                    this.ctx.fillStyle = "#ff007a";
                    this.ctx.font = "12px 'Press Start 2P'";
                    this.ctx.textAlign = "center";
                    this.ctx.fillText("RUN OVER!", cx, cy - 20);

                    this.ctx.fillStyle = "#ffffff";
                    this.ctx.font = "7px 'Press Start 2P'";
                    this.ctx.fillText(`DIST: ${Math.floor(this.distance)}m | EARNED: +${this.coins * 10} SQK`, cx, cy + 5);
                    this.ctx.fillText("TAP TO RESTART", cx, cy + 25);
                }
            }

            loop() {
                this.update();
                this.draw();
                requestAnimationFrame(this.loop);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            window.appEngine = new GameEngine();
        });
    </script>
</body>
</html>
