<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Squeekchain Arcade Genesis</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #03050a;
            color: #00ffcc;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100vw;
            padding: 8px;
            overflow: hidden;
        }

        .main-card {
            width: 100%;
            max-width: 480px;
            height: 96vh;
            max-height: 850px;
            background: #090e1a;
            border: 2px solid #00ffcc;
            border-radius: 10px;
            padding: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.25);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            background: #121b2d;
            border: 1px solid #00ffcc;
            border-radius: 6px;
            flex-shrink: 0;
        }

        .title {
            font-size: 9px;
            color: #ffffff;
            text-shadow: 0 0 4px #00ffcc;
        }

        .btn-wallet {
            background: #ff007a;
            color: #ffffff;
            border: none;
            padding: 6px 10px;
            font-family: inherit;
            font-size: 8px;
            cursor: pointer;
            border-radius: 4px;
            box-shadow: 0 0 6px rgba(255, 0, 122, 0.4);
        }

        .game-box {
            width: 100%;
            flex-grow: 1;
            margin: 8px 0;
            background: #000000;
            border: 2px solid #1a2a40;
            border-radius: 6px;
            position: relative;
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
            flex-shrink: 0;
        }

        .stat-card {
            background: #121b2d;
            border: 1px solid #00ffcc33;
            padding: 6px 4px;
            border-radius: 4px;
            text-align: center;
        }

        .stat-label {
            font-size: 6px;
            color: #7d93ad;
            margin-bottom: 3px;
        }

        .stat-value {
            font-size: 8px;
            color: #00ffcc;
        }

        footer {
            font-size: 6px;
            color: #5d738e;
            text-align: center;
            margin-top: 4px;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <header>
            <div class="title">🐹 SQUEEK GENESIS</div>
            <button class="btn-wallet" id="walletBtn" onclick="connectWallet()">CONNECT WALLET</button>
        </header>

        <div class="game-box" id="gameBox">
            <canvas id="gameCanvas"></canvas>
        </div>

        <div class="dashboard">
            <div class="stat-card">
                <div class="stat-label">STAGE</div>
                <div class="stat-value" id="uiStage">1: CYBER</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">BEST SCORE</div>
                <div class="stat-value" id="uiBest">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">TOTAL $SQK</div>
                <div class="stat-value" id="uiBalance">0 $SQK</div>
            </div>
        </div>

        <footer>TAP / SPACE TO JUMP • PASS PIPES TO ADVANCE STAGES</footer>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gameBox = document.getElementById("gameBox");

        function resizeCanvas() {
            canvas.width = gameBox.clientWidth;
            canvas.height = gameBox.clientHeight;
        }

        let gameState = "START";
        let score = 0;
        let stage = 1;
        let earnedSqk = 0;

        // Permanent Local Storage Data
        let bestScore = localStorage.getItem("sqk_bestScore") ? parseInt(localStorage.getItem("sqk_bestScore")) : 0;
        let totalSqk = localStorage.getItem("sqk_totalCoins") ? parseInt(localStorage.getItem("sqk_totalCoins")) : 100;

        let hamster = { x: 50, y: 150, vy: 0, radius: 11 };
        let pipes = [];
        let coins = [];
        let particles = [];
        let frame = 0;

        function updateUI() {
            document.getElementById("uiBest").innerText = bestScore;
            document.getElementById("uiBalance").innerText = (totalSqk + earnedSqk) + " $SQK";

            if (score < 5) {
                stage = 1;
                document.getElementById("uiStage").innerText = "1: CYBER";
            } else if (score < 15) {
                stage = 2;
                document.getElementById("uiStage").innerText = "2: WHEEL";
            } else {
                stage = 3;
                document.getElementById("uiStage").innerText = "3: CORE";
            }
        }

        function connectWallet() {
            if (window.ethereum) {
                window.ethereum.request({ method: 'eth_requestAccounts' }).then(accs => {
                    let addr = accs[0];
                    document.getElementById("walletBtn").innerText = addr.substring(0, 4) + "..." + addr.substring(38);
                });
            } else {
                alert("Web3 Wallet Not Detected.");
            }
        }

        function jump() {
            if (gameState === "START" || gameState === "GAMEOVER") {
                resetGame();
                gameState = "PLAYING";
            } else if (gameState === "PLAYING") {
                hamster.vy = -4.8;
            }
        }

        window.addEventListener("keydown", (e) => { if (e.code === "Space") jump(); });
        canvas.addEventListener("touchstart", (e) => { e.preventDefault(); jump(); });
        canvas.addEventListener("click", jump);

        function resetGame() {
            score = 0;
            earnedSqk = 0;
            stage = 1;
            hamster.y = canvas.height / 2;
            hamster.vy = 0;
            pipes = [];
            coins = [];
            particles = [];
            frame = 0;
            updateUI();
        }

        function spawnParticles(x, y) {
            for (let i = 0; i < 6; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 4,
                    vy: (Math.random() - 0.5) * 4,
                    life: 15
                });
            }
        }

        function update() {
            if (gameState !== "PLAYING") return;

            frame++;
            hamster.vy += 0.28;
            hamster.y += hamster.vy;

            // Ground & Ceiling Collision
            if (hamster.y + hamster.radius >= canvas.height - 10 || hamster.y - hamster.radius <= 0) {
                endGame();
            }

            // Speed & Pipe Spawning Based on Stage
            let speed = stage === 1 ? 2 : (stage === 2 ? 2.5 : 3.2);
            let spawnRate = stage === 1 ? 95 : (stage === 2 ? 80 : 65);

            if (frame % spawnRate === 0) {
                let gap = stage === 3 ? 90 : 105;
                let topH = Math.floor(Math.random() * (canvas.height - gap - 60)) + 20;
                pipes.push({ x: canvas.width, top: topH, bottom: topH + gap, passed: false });
                coins.push({ x: canvas.width + 15, y: topH + (gap / 2), collected: false });
            }

            pipes.forEach(p => {
                p.x -= speed;
                if (hamster.x + hamster.radius > p.x && hamster.x - hamster.radius < p.x + 30) {
                    if (hamster.y - hamster.radius < p.top || hamster.y + hamster.radius > p.bottom) {
                        endGame();
                    }
                }
                if (p.x + 30 < hamster.x && !p.passed) {
                    score++;
                    earnedSqk += 5;
                    p.passed = true;
                    if (score > bestScore) {
                        bestScore = score;
                        localStorage.setItem("sqk_bestScore", bestScore);
                    }
                    updateUI();
                }
            });

            coins.forEach(c => {
                c.x -= speed;
                if (!c.collected && Math.abs(c.x - hamster.x) < 18 && Math.abs(c.y - hamster.y) < 18) {
                    c.collected = true;
                    earnedSqk += 10;
                    spawnParticles(c.x, c.y);
                    updateUI();
                }
            });

            // Particles update
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
            });

            pipes = pipes.filter(p => p.x > -35);
            coins = coins.filter(c => c.x > -35);
            particles = particles.filter(p => p.life > 0);
        }

        function endGame() {
            gameState = "GAMEOVER";
            totalSqk += earnedSqk;
            localStorage.setItem("sqk_totalCoins", totalSqk);
            updateUI();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Stage-Based Background Color Shift
            let bgColor = stage === 1 ? "#02040a" : (stage === 2 ? "#080614" : "#12030d");
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Ground
            ctx.fillStyle = stage === 3 ? "#ff007a" : "#00ffcc";
            ctx.fillRect(0, canvas.height - 10, canvas.width, 10);

            if (gameState === "PLAYING" || gameState === "GAMEOVER") {
                // Pipes
                pipes.forEach(p => {
                    ctx.fillStyle = stage === 3 ? "#00ffcc" : "#ff007a";
                    ctx.fillRect(p.x, 0, 30, p.top);
                    ctx.fillRect(p.x, p.bottom, 30, canvas.height - p.bottom - 10);
                });

                // Coins
                coins.forEach(c => {
                    if (!c.collected) {
                        ctx.fillStyle = "#ffd700";
                        ctx.beginPath();
                        ctx.arc(c.x, c.y, 6, 0, Math.PI * 2);
                        ctx.fill();
                    }
                });

                // Particles
                particles.forEach(p => {
                    ctx.fillStyle = "#ffd700";
                    ctx.fillRect(p.x, p.y, 3, 3);
                });

                // Hamster
                ctx.fillStyle = "#ffb703";
                ctx.beginPath();
                ctx.arc(hamster.x, hamster.y, hamster.radius, 0, Math.PI * 2);
                ctx.fill();

                // Score Display
                ctx.fillStyle = "#ffffff";
                ctx.font = "12px 'Press Start 2P'";
                ctx.textAlign = "center";
                ctx.fillText(score, canvas.width / 2, 30);
            }

            if (gameState === "START") {
                ctx.fillStyle = "#ffffff";
                ctx.font = "10px 'Press Start 2P'";
                ctx.textAlign = "center";
                ctx.fillText("TAP TO START", canvas.width / 2, canvas.height / 2 - 10);
                ctx.fillStyle = "#00ffcc";
                ctx.font = "7px 'Press Start 2P'";
                ctx.fillText("UNLOCK NEW STAGES & TOKENS", canvas.width / 2, canvas.height / 2 + 15);
            } else if (gameState === "GAMEOVER") {
                ctx.fillStyle = "#ff007a";
                ctx.font = "12px 'Press Start 2P'";
                ctx.textAlign = "center";
                ctx.fillText("RUN OVER", canvas.width / 2, canvas.height / 2 - 25);
                ctx.fillStyle = "#ffffff";
                ctx.font = "8px 'Press Start 2P'";
                ctx.fillText("SCORE: " + score, canvas.width / 2, canvas.height / 2);
                ctx.fillText("EARNED: +" + earnedSqk + " $SQK", canvas.width / 2, canvas.height / 2 + 18);
                ctx.fillText("STAGE REACHED: " + stage, canvas.width / 2, canvas.height / 2 + 36);
                ctx.fillText("TAP TO RESTART", canvas.width / 2, canvas.height / 2 + 58);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        updateUI();
        loop();
    </script>
</body>
</html>
