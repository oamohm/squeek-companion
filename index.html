<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Squeekchain Genesis Flappy</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100vh;
            background-color: #050811;
            color: #00ffcc;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .main-container {
            width: 100%;
            max-width: 500px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            background: #0d1322;
            border: 2px solid #00ffcc;
            padding: 10px;
        }

        header {
            width: 100%;
            height: 45px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            background: #162035;
            border: 2px solid #00ffcc;
            border-radius: 6px;
            flex-shrink: 0;
        }

        .title {
            font-size: 9px;
            color: #ffffff;
            text-shadow: 0 0 5px #00ffcc;
        }

        .btn-wallet {
            background: #ff007a;
            color: #ffffff;
            border: none;
            padding: 6px 10px;
            font-family: inherit;
            font-size: 8px;
            cursor: pointer;
            border-radius: 4px;
        }

        .game-wrapper {
            width: 100%;
            flex: 1;
            margin: 8px 0;
            background: #02040a;
            border: 2px solid #1a2a40;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .wallet-dashboard {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            flex-shrink: 0;
        }

        .stat-box {
            background: #162035;
            border: 1px solid #00ffcc33;
            padding: 8px;
            border-radius: 6px;
            text-align: center;
        }

        .stat-label {
            font-size: 7px;
            color: #8397b0;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 9px;
            color: #00ffcc;
        }

        footer {
            height: 20px;
            font-size: 6px;
            color: #5d738e;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        @media (min-width: 768px) {
            .main-container {
                height: 90vh;
                border-radius: 12px;
                box-shadow: 0 0 25px rgba(0, 255, 204, 0.3);
            }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <header>
            <div class="title">🐹 FLAPPY SQUEEK</div>
            <button class="btn-wallet" id="walletBtn" onclick="connectWallet()">CONNECT WALLET</button>
        </header>

        <div class="game-wrapper" id="canvasWrapper">
            <canvas id="gameCanvas"></canvas>
        </div>

        <div class="wallet-dashboard">
            <div class="stat-box">
                <div class="stat-label">WALLET BAL</div>
                <div class="stat-value" id="uiBalance">0 $SQK</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">EARNED (RUN)</div>
                <div class="stat-value" id="uiEarned">0 $SQK</div>
            </div>
        </div>

        <footer>TAP TO FLAP • EARN $SQK TOKENS</footer>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const wrapper = document.getElementById("canvasWrapper");

        function resizeCanvas() {
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;
        }

        let gameState = "START";
        let score = 0;
        let earnedSqk = 0;
        let totalWalletBalance = 0;

        let hamster = { x: 50, y: 200, vy: 0, radius: 12 };
        let pipes = [];
        let coins = [];
        let frame = 0;

        function connectWallet() {
            if (window.ethereum) {
                window.ethereum.request({ method: 'eth_requestAccounts' }).then(accs => {
                    let addr = accs[0];
                    document.getElementById("walletBtn").innerText = addr.substring(0, 4) + "..." + addr.substring(38);
                    totalWalletBalance = 1250;
                    updateUI();
                });
            } else {
                alert("MetaMask / Web3 Wallet required.");
            }
        }

        function updateUI() {
            document.getElementById("uiBalance").innerText = (totalWalletBalance + earnedSqk) + " $SQK";
            document.getElementById("uiEarned").innerText = "+" + earnedSqk + " $SQK";
        }

        function jump() {
            if (gameState === "START" || gameState === "GAMEOVER") {
                resetGame();
                gameState = "PLAYING";
            } else if (gameState === "PLAYING") {
                hamster.vy = -5.5;
            }
        }

        window.addEventListener("keydown", (e) => { if (e.code === "Space") jump(); });
        canvas.addEventListener("touchstart", (e) => { e.preventDefault(); jump(); });
        canvas.addEventListener("click", jump);

        function resetGame() {
            score = 0;
            earnedSqk = 0;
            hamster.y = canvas.height / 2;
            hamster.vy = 0;
            pipes = [];
            coins = [];
            frame = 0;
            updateUI();
        }

        function update() {
            if (gameState !== "PLAYING") return;

            frame++;
            hamster.vy += 0.3;
            hamster.y += hamster.vy;

            if (hamster.y + hamster.radius >= canvas.height - 12 || hamster.y - hamster.radius <= 0) {
                endGame();
            }

            if (frame % 100 === 0) {
                let gap = 110;
                let topH = Math.floor(Math.random() * (canvas.height - gap - 80)) + 30;
                pipes.push({ x: canvas.width, top: topH, bottom: topH + gap, passed: false });
                coins.push({ x: canvas.width + 18, y: topH + (gap / 2), collected: false });
            }

            pipes.forEach(p => {
                p.x -= 2;
                if (hamster.x + hamster.radius > p.x && hamster.x - hamster.radius < p.x + 35) {
                    if (hamster.y - hamster.radius < p.top || hamster.y + hamster.radius > p.bottom) {
                        endGame();
                    }
                }
                if (p.x + 35 < hamster.x && !p.passed) {
                    score++;
                    earnedSqk += 5;
                    p.passed = true;
                    updateUI();
                }
            });

            coins.forEach(c => {
                c.x -= 2;
                if (!c.collected && Math.abs(c.x - hamster.x) < 20 && Math.abs(c.y - hamster.y) < 20) {
                    c.collected = true;
                    earnedSqk += 10;
                    updateUI();
                }
            });

            pipes = pipes.filter(p => p.x > -40);
            coins = coins.filter(c => c.x > -40);
        }

        function endGame() {
            gameState = "GAMEOVER";
            totalWalletBalance += earnedSqk;
            updateUI();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Ground
            ctx.fillStyle = "#00ffcc";
            ctx.fillRect(0, canvas.height - 12, canvas.width, 12);

            if (gameState === "PLAYING" || gameState === "GAMEOVER") {
                pipes.forEach(p => {
                    ctx.fillStyle = "#ff007a";
                    ctx.fillRect(p.x, 0, 35, p.top);
                    ctx.fillRect(p.x, p.bottom, 35, canvas.height - p.bottom - 12);
                });

                coins.forEach(c => {
                    if (!c.collected) {
                        ctx.fillStyle = "#ffd700";
                        ctx.beginPath();
                        ctx.arc(c.x, c.y, 7, 0, Math.PI * 2);
                        ctx.fill();
                    }
                });

                ctx.fillStyle = "#ffb703";
                ctx.beginPath();
                ctx.arc(hamster.x, hamster.y, hamster.radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = "#ffffff";
                ctx.font = "12px 'Press Start 2P'";
                ctx.textAlign = "center";
                ctx.fillText(score, canvas.width / 2, 35);
            }

            if (gameState === "START") {
                ctx.fillStyle = "#ffffff";
                ctx.font = "10px 'Press Start 2P'";
                ctx.textAlign = "center";
                ctx.fillText("TAP TO START", canvas.width / 2, canvas.height / 2 - 10);
                ctx.fillStyle = "#00ffcc";
                ctx.font = "7px 'Press Start 2P'";
                ctx.fillText("COLLECT $SQK TOKENS", canvas.width / 2, canvas.height / 2 + 15);
            } else if (gameState === "GAMEOVER") {
                ctx.fillStyle = "#ff007a";
                ctx.font = "12px 'Press Start 2P'";
                ctx.textAlign = "center";
                ctx.fillText("RUN OVER", canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillStyle = "#ffffff";
                ctx.font = "8px 'Press Start 2P'";
                ctx.fillText("SCORE: " + score, canvas.width / 2, canvas.height / 2 + 10);
                ctx.fillText("EARNED: +" + earnedSqk + " $SQK", canvas.width / 2, canvas.height / 2 + 28);
                ctx.fillText("TAP TO RESTART", canvas.width / 2, canvas.height / 2 + 50);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        loop();
    </script>
</body>
</html>
