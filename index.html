<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Squeekchain Genesis Runner</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050811;
            color: #00ffcc;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            width: 100vw;
            padding: 8px;
            overflow: hidden;
        }

        header {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            background: #0e1726;
            border: 2px solid #00ffcc;
            border-radius: 6px;
            flex-shrink: 0;
        }

        .title {
            font-size: 9px;
            color: #fff;
        }

        .btn-wallet {
            background: #ff007a;
            color: #fff;
            border: none;
            padding: 6px 8px;
            font-family: inherit;
            font-size: 8px;
            cursor: pointer;
            border-radius: 4px;
        }

        .game-wrapper {
            position: relative;
            width: 100%;
            max-width: 480px;
            flex: 1 1 auto;
            margin: 6px 0;
            background: #02040a;
            border: 2px solid #00ffcc;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .dashboard-grid {
            width: 100%;
            max-width: 480px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            flex-shrink: 0;
        }

        .stat-card {
            background: #0e1726;
            border: 1px solid #1f3552;
            padding: 6px;
            border-radius: 4px;
            text-align: center;
        }

        .stat-card .label {
            font-size: 6px;
            color: #8fa0b5;
            margin-bottom: 2px;
        }

        .stat-card .value {
            font-size: 9px;
            color: #00ffcc;
        }

        footer {
            font-size: 6px;
            color: #5d738e;
            text-align: center;
            margin-top: 4px;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <header>
        <div class="title">🐹 SQUEEK Genesis</div>
        <button class="btn-wallet" id="walletBtn" onclick="connectWallet()">CONNECT WALLET</button>
    </header>

    <div class="game-wrapper" id="gameBox">
        <canvas id="gameCanvas"></canvas>
    </div>

    <div class="dashboard-grid">
        <div class="stat-card">
            <div class="label">DISTANCE</div>
            <div class="value" id="uiDist">0 m</div>
        </div>
        <div class="stat-card">
            <div class="label">$SQK COINS</div>
            <div class="value" id="uiCoins">0</div>
        </div>
        <div class="stat-card">
            <div class="label">ENERGY</div>
            <div class="value" id="uiEnergy">100%</div>
        </div>
        <div class="stat-card">
            <div class="label">CHAIN STATUS</div>
            <div class="value" style="color: #ff007a;" id="uiChain">OFFLINE</div>
        </div>
    </div>

    <footer>TAP SCREEN TO JUMP • KEEP HAMSTER ALIVE</footer>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gameBox = document.getElementById("gameBox");

        let audioCtx = null;

        function playSound(freq, type, duration) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function resizeCanvas() {
            canvas.width = gameBox.clientWidth;
            canvas.height = gameBox.clientHeight;
        }

        let gameState = "START";
        let score = 0;
        let coins = 0;
        let energy = 100;

        let hamster = { x: 0, y: 0, vy: 0, grounded: true, radius: 12 };
        let obstacles = [];
        let coinItems = [];
        let wheelAngle = 0;
        let frame = 0;

        function connectWallet() {
            if (window.ethereum) {
                window.ethereum.request({ method: 'eth_requestAccounts' }).then(accs => {
                    let addr = accs[0];
                    document.getElementById("walletBtn").innerText = addr.substring(0, 4) + "..." + addr.substring(38);
                    document.getElementById("uiChain").innerText = "ONLINE";
                    document.getElementById("uiChain").style.color = "#00ffcc";
                    playSound(600, 'sine', 0.2);
                }).catch(() => {});
            } else {
                alert("Web3 Wallet required.");
            }
        }

        function jump() {
            if (gameState === "START" || gameState === "GAMEOVER") {
                resetGame();
                gameState = "PLAYING";
                playSound(440, 'square', 0.1);
            } else if (hamster.grounded) {
                hamster.vy = - canvas.height * 0.022;
                hamster.grounded = false;
                playSound(350, 'sine', 0.15);
            }
        }

        window.addEventListener("keydown", (e) => { if (e.code === "Space") jump(); });
        gameBox.addEventListener("touchstart", (e) => { e.preventDefault(); jump(); }, { passive: false });
        gameBox.addEventListener("click", jump);

        function resetGame() {
            score = 0;
            coins = 0;
            energy = 100;
            hamster.vy = 0;
            obstacles = [];
            coinItems = [];
            frame = 0;
        }

        function update() {
            if (gameState !== "PLAYING") return;

            frame++;
            score += 0.1;
            energy -= 0.025;
            wheelAngle += 0.04;

            if (energy <= 0) {
                gameState = "GAMEOVER";
                playSound(150, 'sawtooth', 0.3);
            }

            let groundY = canvas.height * 0.72;
            hamster.x = canvas.width * 0.22;

            hamster.vy += canvas.height * 0.001;
            hamster.y += hamster.vy;

            if (hamster.y >= groundY) {
                hamster.y = groundY;
                hamster.vy = 0;
                hamster.grounded = true;
            }

            if (frame % 90 === 0) {
                obstacles.push({ x: canvas.width, size: canvas.width * 0.05 });
            }
            if (frame % 110 === 0) {
                coinItems.push({ x: canvas.width, y: groundY - (Math.random() * canvas.height * 0.15 + 20) });
            }

            let moveSpeed = canvas.width * 0.009;

            obstacles.forEach((obs, idx) => {
                obs.x -= moveSpeed;
                if (Math.abs(obs.x - hamster.x) < 20 && hamster.y > groundY - 10) {
                    energy -= 20;
                    playSound(100, 'square', 0.2);
                    obstacles.splice(idx, 1);
                }
            });

            coinItems.forEach((c, idx) => {
                c.x -= moveSpeed;
                if (Math.abs(c.x - hamster.x) < 20 && Math.abs(c.y - hamster.y) < 20) {
                    coins += 1;
                    energy = Math.min(100, energy + 12);
                    playSound(800, 'sine', 0.1);
                    coinItems.splice(idx, 1);
                }
            });

            obstacles = obstacles.filter(o => o.x > -20);
            coinItems = coinItems.filter(c => c.x > -20);

            document.getElementById("uiDist").innerText = Math.floor(score) + " m";
            document.getElementById("uiCoins").innerText = coins;
            document.getElementById("uiEnergy").innerText = Math.max(0, Math.floor(energy)) + "%";
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let centerX = canvas.width / 2;
            let centerY = canvas.height / 2;
            let wheelRadius = Math.min(canvas.width, canvas.height) * 0.42;

            // Outer Wheel Ring
            ctx.strokeStyle = "#00ffcc";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(centerX, centerY, wheelRadius, 0, Math.PI * 2);
            ctx.stroke();

            // Wheel Spokes
            for (let i = 0; i < 8; i++) {
                let ang = wheelAngle + (i * Math.PI / 4);
                ctx.strokeStyle = "#162b42";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.lineTo(centerX + Math.cos(ang) * wheelRadius, centerY + Math.sin(ang) * wheelRadius);
                ctx.stroke();
            }

            // Track Arc
            ctx.strokeStyle = "#ff007a";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(centerX, centerY, wheelRadius - 10, 0.2 * Math.PI, 0.8 * Math.PI);
            ctx.stroke();

            let groundY = canvas.height * 0.72;

            if (gameState === "PLAYING") {
                // Hamster Body
                ctx.fillStyle = "#ffb703";
                ctx.beginPath();
                ctx.arc(hamster.x, hamster.y, hamster.radius, 0, Math.PI * 2);
                ctx.fill();

                // Ears
                ctx.fillStyle = "#fb8500";
                ctx.beginPath();
                ctx.arc(hamster.x - 4, hamster.y - 10, 3, 0, Math.PI * 2);
                ctx.arc(hamster.x + 4, hamster.y - 10, 3, 0, Math.PI * 2);
                ctx.fill();

                // Obstacles
                ctx.fillStyle = "#ff0055";
                obstacles.forEach(obs => {
                    ctx.fillRect(obs.x, groundY - obs.size / 2, obs.size, obs.size);
                });

                // Coins
                ctx.fillStyle = "#ffd700";
                coinItems.forEach(c => {
                    ctx.beginPath();
                    ctx.arc(c.x, c.y, 6, 0, Math.PI * 2);
                    ctx.fill();
                });
            } else if (gameState === "START") {
                ctx.fillStyle = "#ffffff";
                ctx.font = "10px 'Press Start 2P'";
                ctx.textAlign = "center";
                ctx.fillText("TAP TO RUN", centerX, centerY - 10);
                ctx.fillStyle = "#00ffcc";
                ctx.font = "7px 'Press Start 2P'";
                ctx.fillText("KEEP WHEEL SPINNING!", centerX, centerY + 15);
            } else if (gameState === "GAMEOVER") {
                ctx.fillStyle = "#ff007a";
                ctx.font = "12px 'Press Start 2P'";
                ctx.textAlign = "center";
                ctx.fillText("EXHAUSTED!", centerX, centerY - 20);
                ctx.fillStyle = "#ffffff";
                ctx.font = "7px 'Press Start 2P'";
                ctx.fillText("DISTANCE: " + Math.floor(score) + "m", centerX, centerY + 5);
                ctx.fillText("TAP TO RESTART", centerX, centerY + 25);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        loop();
    </script>
</body>
</html>
