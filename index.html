<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Squeekchain Genesis Flappy</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050811;
            color: #00ffcc;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100vw;
            padding: 10px;
            overflow: hidden;
        }

        .main-container {
            width: 100%;
            max-width: 480px;
            height: 95vh;
            max-height: 800px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            background: #0d1322;
            border: 3px solid #00ffcc;
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.25);
        }

        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            background: #162035;
            border: 2px solid #00ffcc;
            border-radius: 6px;
        }

        .title {
            font-size: 9px;
            color: #ffffff;
            text-shadow: 0 0 5px #00ffcc;
        }

        .btn-wallet {
            background: #ff007a;
            color: #ffffff;
            border: none;
            padding: 8px 10px;
            font-family: inherit;
            font-size: 8px;
            cursor: pointer;
            border-radius: 4px;
            box-shadow: 0 0 8px rgba(255, 0, 122, 0.4);
        }

        .game-wrapper {
            position: relative;
            width: 100%;
            flex-grow: 1;
            margin: 10px 0;
            background: #02040a;
            border: 2px solid #1a2a40;
            border-radius: 8px;
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .wallet-dashboard {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .stat-box {
            background: #162035;
            border: 1px solid #00ffcc33;
            padding: 8px;
            border-radius: 6px;
            text-align: center;
        }

        .stat-label {
            font-size: 7px;
            color: #8397b0;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 10px;
            color: #00ffcc;
        }

        footer {
            margin-top: 6px;
            font-size: 7px;
            color: #5d738e;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <header>
            <div class="title">🐹 FLAPPY SQUEEK</div>
            <button class="btn-wallet" id="walletBtn" onclick="connectWallet()">CONNECT WALLET</button>
        </header>

        <div class="game-wrapper">
            <canvas id="gameCanvas"></canvas>
        </div>

        <div class="wallet-dashboard">
            <div class="stat-box">
                <div class="stat-label">WALLETS BAL</div>
                <div class="stat-value" id="uiBalance">0 $SQK</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">EARNED (RUN)</div>
                <div class="stat-value" id="uiEarned">0 $SQK</div>
            </div>
        </div>

        <footer>PRESS SPACE / TAP TO FLAP • EARN $SQK</footer>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);

        let gameState = "START";
        let score = 0;
        let earnedSqk = 0;
        let totalWalletBalance = 0;
        let walletAddress = null;

        let hamster = { x: 50, y: 200, vy: 0, radius: 12 };
        let pipes = [];
        let coins = [];
        let frame = 0;

        function connectWallet() {
            if (window.ethereum) {
                window.ethereum.request({ method: 'eth_requestAccounts' }).then(accs => {
                    walletAddress = accs[0];
                    document.getElementById("walletBtn").innerText = walletAddress.substring(0, 4) + "..." + walletAddress.substring(38);
                    totalWalletBalance = 1250; // Initial On-Chain mock balance
                    updateUI();
                });
            } else {
                alert("MetaMask / Web3 Wallet required.");
            }
        }

        function updateUI() {
            document.getElementById("uiBalance").innerText = (totalWalletBalance + earnedSqk) + " $SQK";
            document.getElementById("uiEarned").innerText = "+" + earnedSqk + " $SQK";
        }

        function jump() {
            if (gameState === "START" || gameState === "GAMEOVER") {
                resetGame();
                gameState = "PLAYING";
            } else if (gameState === "PLAYING") {
                hamster.vy = -5.5;
            }
        }

        window.addEventListener("keydown", (e) => { if (e.code === "Space") jump(); });
        canvas.addEventListener("touchstart", (e) => { e.preventDefault(); jump(); });
        canvas.addEventListener("click", jump);

        function resetGame() {
            score = 0;
            earnedSqk = 0;
            hamster.y = canvas.height / 2;
            hamster.vy = 0;
            pipes = [];
            coins = [];
            frame = 0;
            updateUI();
        }

        function update() {
            if (gameState !== "PLAYING") return;

            frame++;
            hamster.vy += 0.3;
            hamster.y += hamster.vy;

            // Ground & Top collision
            if (hamster.y + hamster.radius >= canvas.height - 15 || hamster.y - hamster.radius <= 0) {
                endGame();
            }

            // Spawn Pipes & Coins
            if (frame % 100 === 0) {
                let gap = 110;
                let topH = Math.floor(Math.random() * (canvas.height - gap - 100)) + 40;
                pipes.push({ x: canvas.width, top: topH, bottom: topH + gap, passed: false });
                coins.push({ x: canvas.width + 20, y: topH + (gap / 2), collected: false });
            }

            // Pipes Movement & Collision
            pipes.forEach(p => {
                p.x -= 2;
                if (hamster.x + hamster.radius > p.x && hamster.x - hamster.radius < p.x + 35) {
                    if (hamster.y - hamster.radius < p.top || hamster.y + hamster.radius > p.bottom) {
                        endGame();
                    }
                }
                if (p.x + 35 < hamster.x && !p.passed) {
                    score++;
                    earnedSqk += 5; // 5 SQK per obstacle
                    p.passed = true;
                    updateUI();
                }
            });

            // Coins Movement & Collection
            coins.forEach(c => {
                c.x -= 2;
                if (!c.collected && Math.abs(c.x - hamster.x) < 20 && Math.abs(c.y - hamster.y) < 20) {
                    c.collected = true;
                    earnedSqk += 10; // 10 SQK per Coin
                    updateUI();
                }
            });

            pipes = pipes.filter(p => p.x > -40);
            coins = coins.filter(c => c.x > -40);
        }

        function endGame() {
            gameState = "GAMEOVER";
            totalWalletBalance += earnedSqk;
            updateUI();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Ground Track
            ctx.fillStyle = "#00ffcc";
            ctx.fillRect(0, canvas.height - 15, canvas.width, 15);

            if (gameState === "PLAYING" || gameState === "GAMEOVER") {
                // Pipes
                pipes.forEach(p => {
                    ctx.fillStyle = "#ff007a";
                    ctx.fillRect(p.x, 0, 35, p.top);
                    ctx.fillRect(p.x, p.bottom, 35, canvas.height - p.bottom - 15);
                });

                // Coins
                coins.forEach(c => {
                    if (!c.collected) {
                        ctx.fillStyle = "#ffd700";
                        ctx.beginPath();
                        ctx.arc(c.x, c.y, 7, 0, Math.PI * 2);
                        ctx.fill();
                    }
                });

                // Hamster
                ctx.fillStyle = "#ffb703";
                ctx.beginPath();
                ctx.arc(hamster.x, hamster.y, hamster.radius, 0, Math.PI * 2);
                ctx.fill();

                // Score Display
                ctx.fillStyle = "#ffffff";
                ctx.font = "14px 'Press Start 2P'";
                ctx.textAlign = "center";
                ctx.fillText(score, canvas.width / 2, 40);
            }

            if (gameState === "START") {
                ctx.fillStyle = "#ffffff";
                ctx.font = "10px 'Press Start 2P'";
                ctx.textAlign = "center";
                ctx.fillText("TAP TO START", canvas.width / 2, canvas.height / 2 - 10);
                ctx.fillStyle = "#00ffcc";
                ctx.font = "7px 'Press Start 2P'";
                ctx.fillText("COLLECT $SQK COINS", canvas.width / 2, canvas.height / 2 + 15);
            } else if (gameState === "GAMEOVER") {
                ctx.fillStyle = "#ff007a";
                ctx.font = "12px 'Press Start 2P'";
                ctx.textAlign = "center";
                ctx.fillText("RUN OVER", canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillStyle = "#ffffff";
                ctx.font = "8px 'Press Start 2P'";
                ctx.fillText("SCORE: " + score, canvas.width / 2, canvas.height / 2 + 10);
                ctx.fillText("EARNED: +" + earnedSqk + " $SQK", canvas.width / 2, canvas.height / 2 + 30);
                ctx.fillText("TAP TO RESTART", canvas.width / 2, canvas.height / 2 + 55);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        resizeCanvas();
        loop();
    </script>
</body>
</html>
