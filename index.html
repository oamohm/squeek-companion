<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Squeekchain Flappy Hamster</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0e14;
            color: #00ffcc;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 10px;
        }

        header {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #161e2e;
            border: 2px solid #00ffcc;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .title {
            font-size: 10px;
            color: #fff;
        }

        .btn-wallet {
            background: #ff007a;
            color: #fff;
            border: none;
            padding: 6px 10px;
            font-family: inherit;
            font-size: 8px;
            cursor: pointer;
            border-radius: 4px;
        }

        .game-wrapper {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 500px;
            background: #101826;
            border: 3px solid #00ffcc;
            border-radius: 10px;
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .info {
            margin-top: 10px;
            font-size: 8px;
            color: #8899ac;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <div class="title">🐹 FLAPPY SQUEEK</div>
        <button class="btn-wallet" id="walletBtn" onclick="connectWallet()">CONNECT</button>
    </header>

    <div class="game-wrapper">
        <canvas id="gameCanvas" width="360" height="480"></canvas>
    </div>

    <div class="info">TAP / SPACE TO JUMP • PASS PIPES</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let gameState = "START"; 
        let score = 0;
        let highScore = 0;

        let hamster = { x: 60, y: 200, vy: 0, radius: 12 };
        let pipes = [];
        let frame = 0;

        function connectWallet() {
            if (window.ethereum) {
                window.ethereum.request({ method: 'eth_requestAccounts' }).then(accs => {
                    let addr = accs[0];
                    document.getElementById("walletBtn").innerText = addr.substring(0, 4) + "..." + addr.substring(38);
                });
            }
        }

        function jump() {
            if (gameState === "START" || gameState === "GAMEOVER") {
                resetGame();
                gameState = "PLAYING";
            } else if (gameState === "PLAYING") {
                hamster.vy = -6;
            }
        }

        window.addEventListener("keydown", (e) => { if (e.code === "Space") jump(); });
        canvas.addEventListener("touchstart", (e) => { e.preventDefault(); jump(); });
        canvas.addEventListener("click", jump);

        function resetGame() {
            score = 0;
            hamster.y = 200;
            hamster.vy = 0;
            pipes = [];
            frame = 0;
        }

        function update() {
            if (gameState !== "PLAYING") return;

            frame++;
            hamster.vy += 0.35; 
            hamster.y += hamster.vy;

            // Ground & Ceiling collision
            if (hamster.y + hamster.radius >= 460 || hamster.y - hamster.radius <= 0) {
                gameState = "GAMEOVER";
            }

            // Spawn Pipes
            if (frame % 90 === 0) {
                let gap = 110;
                let topHeight = Math.floor(Math.random() * (220 - 50)) + 50;
                pipes.push({
                    x: 360,
                    top: topHeight,
                    bottom: topHeight + gap,
                    passed: false
                });
            }

            // Move Pipes & Check Collision
            pipes.forEach(p => {
                p.x -= 2;

                // Collision Detection
                if (hamster.x + hamster.radius > p.x && hamster.x - hamster.radius < p.x + 40) {
                    if (hamster.y - hamster.radius < p.top || hamster.y + hamster.radius > p.bottom) {
                        gameState = "GAMEOVER";
                    }
                }

                // Score Increment
                if (p.x + 40 < hamster.x && !p.passed) {
                    score++;
                    p.passed = true;
                    if (score > highScore) highScore = score;
                }
            });

            pipes = pipes.filter(p => p.x > -50);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Ground
            ctx.fillStyle = "#00ffcc";
            ctx.fillRect(0, 460, canvas.width, 20);

            if (gameState === "PLAYING" || gameState === "GAMEOVER") {
                // Draw Pipes
                pipes.forEach(p => {
                    ctx.fillStyle = "#ff007a";
                    ctx.fillRect(p.x, 0, 40, p.top);
                    ctx.fillRect(p.x, p.bottom, 40, 460 - p.bottom);
                });

                // Draw Hamster
                ctx.fillStyle = "#ffb703";
                ctx.beginPath();
                ctx.arc(hamster.x, hamster.y, hamster.radius, 0, Math.PI * 2);
                ctx.fill();

                // Ears
                ctx.fillStyle = "#fb8500";
                ctx.beginPath();
                ctx.arc(hamster.x - 5, hamster.y - 10, 3, 0, Math.PI * 2);
                ctx.arc(hamster.x + 5, hamster.y - 10, 3, 0, Math.PI * 2);
                ctx.fill();

                // Draw Score
                ctx.fillStyle = "#ffffff";
                ctx.font = "16px 'Press Start 2P'";
                ctx.textAlign = "center";
                ctx.fillText(score, 180, 50);
            }

            if (gameState === "START") {
                ctx.fillStyle = "#ffffff";
                ctx.font = "12px 'Press Start 2P'";
                ctx.textAlign = "center";
                ctx.fillText("TAP TO START", 180, 220);
                ctx.fillStyle = "#00ffcc";
                ctx.font = "8px 'Press Start 2P'";
                ctx.fillText("AVOID PIPES!", 180, 250);
            } else if (gameState === "GAMEOVER") {
                ctx.fillStyle = "#ff007a";
                ctx.font = "14px 'Press Start 2P'";
                ctx.textAlign = "center";
                ctx.fillText("GAME OVER", 180, 200);
                ctx.fillStyle = "#ffffff";
                ctx.font = "8px 'Press Start 2P'";
                ctx.fillText("SCORE: " + score, 180, 230);
                ctx.fillText("BEST: " + highScore, 180, 250);
                ctx.fillText("TAP TO RESTART", 180, 280);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
