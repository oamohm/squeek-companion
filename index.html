<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Squeekchain Simple Runner</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background: #03060d;
            color: #00ffcc;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
        .game-container {
            width: 100%;
            max-width: 400px;
            height: 80vh;
            display: flex;
            flex-direction: column;
            background: #0d1626;
            border: 2px solid #00ffcc;
            border-radius: 8px;
            padding: 10px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px;
            font-size: 10px;
            border-bottom: 1px solid #1f3552;
            margin-bottom: 8px;
        }
        canvas {
            flex: 1;
            background: #000;
            border: 1px solid #00ffcc;
            display: block;
            width: 100%;
        }
        .footer-info {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 9px;
            color: #8fa0b5;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <header>
            <span>SQUEEK RUNNER</span>
            <span id="scoreText">SCORE: 0</span>
        </header>
        <canvas id="cvs"></canvas>
        <div class="footer-info">
            <span>TAP TO JUMP</span>
            <span style="color: #ffd700;" id="tokenText">SQK: 0</span>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("cvs");
        const ctx = canvas.getContext("2d");

        function resize() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let player = { x: 50, y: 150, r: 12, vy: 0, gravity: 0.5, jump: -8, grounded: false };
        let obstacles = [];
        let score = 0;
        let tokens = 0;
        let isOver = false;

        function reset() {
            player.y = canvas.height / 2;
            player.vy = 0;
            obstacles = [];
            score = 0;
            tokens = 0;
            isOver = false;
        }

        function triggerJump() {
            if (isOver) {
                reset();
            } else if (player.grounded) {
                player.vy = player.jump;
                player.grounded = false;
            }
        }

        window.addEventListener('keydown', e => { if (e.code === 'Space') triggerJump(); });
        canvas.addEventListener('click', triggerJump);
        canvas.addEventListener('touchstart', e => { e.preventDefault(); triggerJump(); });

        let frame = 0;
        function loop() {
            frame++;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let groundY = canvas.height - 30;

            // Physics
            if (!isOver) {
                player.vy += player.gravity;
                player.y += player.vy;

                if (player.y >= groundY - player.r) {
                    player.y = groundY - player.r;
                    player.vy = 0;
                    player.grounded = true;
                }

                if (frame % 90 === 0) {
                    obstacles.push({ x: canvas.width, w: 15, h: 25, type: Math.random() > 0.5 ? 'obs' : 'coin' });
                }

                obstacles.forEach(o => {
                    o.x -= 3;
                    // Collision
                    if (Math.abs(o.x - player.x) < 20) {
                        if (o.type === 'obs' && player.y + player.r >= groundY - o.h) {
                            isOver = true;
                        } else if (o.type === 'coin' && Math.abs((groundY - o.h/2) - player.y) < 25) {
                            tokens += 5;
                            o.x = -100; // remove
                        }
                    }
                });

                obstacles = obstacles.filter(o => o.x > -30);
                score++;
            }

            // Draw Ground
            ctx.fillStyle = "#ff007a";
            ctx.fillRect(0, groundY, canvas.width, 4);

            // Draw Player
            ctx.fillStyle = "#ffb703";
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
            ctx.fill();

            // Draw Obstacles & Coins
            obstacles.forEach(o => {
                if (o.type === 'obs') {
                    ctx.fillStyle = "#ff0055";
                    ctx.fillRect(o.x, groundY - o.h, o.w, o.h);
                } else {
                    ctx.fillStyle = "#ffd700";
                    ctx.beginPath();
                    ctx.arc(o.x, groundY - 15, 7, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            // UI
            document.getElementById("scoreText").innerText = "SCORE: " + Math.floor(score/10);
            document.getElementById("tokenText").innerText = "SQK: " + tokens;

            if (isOver) {
                ctx.fillStyle = "#ffffff";
                ctx.font = "12px monospace";
                ctx.textAlign = "center";
                ctx.fillText("GAME OVER - TAP TO RESTART", canvas.width / 2, canvas.height / 2);
            }

            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
