<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Squeekchain Genesis Runner</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050811;
            color: #00ffcc;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 10px;
            overflow-x: hidden;
        }

        header {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: #0e1726;
            border: 2px solid #00ffcc;
            border-radius: 8px;
            margin-bottom: 10px;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
        }

        .title {
            font-size: 10px;
            color: #fff;
            text-shadow: 0 0 5px #00ffcc;
        }

        .btn-wallet {
            background: #ff007a;
            color: #fff;
            border: none;
            padding: 8px;
            font-family: inherit;
            font-size: 8px;
            cursor: pointer;
            border-radius: 4px;
        }

        .game-wrapper {
            position: relative;
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1 / 1;
            background: #02040a;
            border: 3px solid #00ffcc;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .dashboard-grid {
            width: 100%;
            max-width: 500px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }

        .stat-card {
            background: #0e1726;
            border: 1px solid #1f3552;
            padding: 8px;
            border-radius: 6px;
            text-align: center;
        }

        .stat-card .label {
            font-size: 8px;
            color: #8fa0b5;
            margin-bottom: 4px;
        }

        .stat-card .value {
            font-size: 11px;
            color: #00ffcc;
        }

        footer {
            margin-top: 8px;
            font-size: 7px;
            color: #5d738e;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <div class="title">🐹 SQUEEK RUNNER</div>
        <button class="btn-wallet" id="walletBtn" onclick="connectWallet()">CONNECT WALLET</button>
    </header>

    <div class="game-wrapper">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
    </div>

    <div class="dashboard-grid">
        <div class="stat-card">
            <div class="label">DISTANCE</div>
            <div class="value" id="uiDist">0 m</div>
        </div>
        <div class="stat-card">
            <div class="label">$SQK COINS</div>
            <div class="value" id="uiCoins">0</div>
        </div>
        <div class="stat-card">
            <div class="label">ENERGY</div>
            <div class="value" id="uiEnergy">100%</div>
        </div>
        <div class="stat-card">
            <div class="label">CHAIN STATUS</div>
            <div class="value" style="color: #ff007a;" id="uiChain">OFFLINE</div>
        </div>
    </div>

    <footer>TAP SCREEN TO JUMP • COLLECT COINS</footer>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let audioCtx = null;

        function playSound(freq, type, duration) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        let gameState = "START";
        let score = 0;
        let coins = 0;
        let energy = 100;
        let walletAddress = null;

        let hamster = { x: 80, y: 280, vy: 0, grounded: true, radius: 14 };
        let obstacles = [];
        let coinItems = [];
        let wheelAngle = 0;
        let frame = 0;

        function connectWallet() {
            if (window.ethereum) {
                window.ethereum.request({ method: 'eth_requestAccounts' }).then(accs => {
                    walletAddress = accs[0];
                    document.getElementById("walletBtn").innerText = walletAddress.substring(0, 6) + "..." + walletAddress.substring(38);
                    document.getElementById("uiChain").innerText = "ONLINE";
                    document.getElementById("uiChain").style.color = "#00ffcc";
                    playSound(600, 'sine', 0.2);
                }).catch(() => {});
            } else {
                alert("Web3 Wallet required.");
            }
        }

        function jump() {
            if (gameState === "START" || gameState === "GAMEOVER") {
                resetGame();
                gameState = "PLAYING";
                playSound(440, 'square', 0.1);
            } else if (hamster.grounded) {
                hamster.vy = -9.5;
                hamster.grounded = false;
                playSound(350, 'sine', 0.15);
            }
        }

        window.addEventListener("keydown", (e) => { if (e.code === "Space") jump(); });
        canvas.addEventListener("touchstart", (e) => { e.preventDefault(); jump(); });
        canvas.addEventListener("click", jump);

        function resetGame() {
            score = 0;
            coins = 0;
            energy = 100;
            hamster.y = 280;
            hamster.vy = 0;
            obstacles = [];
            coinItems = [];
            frame = 0;
        }

        function update() {
            if (gameState !== "PLAYING") return;

            frame++;
            score += 0.1;
            energy -= 0.035;
            wheelAngle += 0.05;

            if (energy <= 0) {
                gameState = "GAMEOVER";
                playSound(150, 'sawtooth', 0.4);
            }

            hamster.vy += 0.5;
            hamster.y += hamster.vy;

            if (hamster.y >= 280) {
                hamster.y = 280;
                hamster.vy = 0;
                hamster.grounded = true;
            }

            if (frame % 90 === 0) {
                obstacles.push({ x: 420, size: 18 });
            }
            if (frame % 110 === 0) {
                coinItems.push({ x: 420, y: 220 - Math.random() * 40 });
            }

            obstacles.forEach((obs, idx) => {
                obs.x -= 4;
                if (Math.abs(obs.x - hamster.x) < 20 && hamster.y > 260) {
                    energy -= 20;
                    playSound(100, 'square', 0.2);
                    obstacles.splice(idx, 1);
                }
            });

            coinItems.forEach((c, idx) => {
                c.x -= 4;
                if (Math.abs(c.x - hamster.x) < 20 && Math.abs(c.y - hamster.y) < 20) {
                    coins += 1;
                    energy = Math.min(100, energy + 12);
                    playSound(800, 'sine', 0.1);
                    coinItems.splice(idx, 1);
                }
            });

            obstacles = obstacles.filter(o => o.x > -20);
            coinItems = coinItems.filter(c => c.x > -20);

            document.getElementById("uiDist").innerText = Math.floor(score) + " m";
            document.getElementById("uiCoins").innerText = coins;
            document.getElementById("uiEnergy").innerText = Math.max(0, Math.floor(energy)) + "%";
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Wheel Outer Ring
            ctx.strokeStyle = "#00ffcc";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(200, 200, 160, 0, Math.PI * 2);
            ctx.stroke();

            // Wheel Spokes
            for (let i = 0; i < 8; i++) {
                let ang = wheelAngle + (i * Math.PI / 4);
                ctx.strokeStyle = "#162b42";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(200, 200);
                ctx.lineTo(200 + Math.cos(ang) * 160, 200 + Math.sin(ang) * 160);
                ctx.stroke();
            }

            // Ground Track
            ctx.strokeStyle = "#ff007a";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(200, 200, 150, 0.25 * Math.PI, 0.75 * Math.PI);
            ctx.stroke();

            if (gameState === "PLAYING") {
                // Hamster
                ctx.fillStyle = "#ffb703";
                ctx.beginPath();
                ctx.arc(hamster.x, hamster.y, hamster.radius, 0, Math.PI * 2);
                ctx.fill();

                // Ears
                ctx.fillStyle = "#fb8500";
                ctx.beginPath();
                ctx.arc(hamster.x - 6, hamster.y - 12, 4, 0, Math.PI * 2);
                ctx.arc(hamster.x + 6, hamster.y - 12, 4, 0, Math.PI * 2);
                ctx.fill();

                // Obstacles
                ctx.fillStyle = "#ff0055";
                obstacles.forEach(obs => {
                    ctx.fillRect(obs.x, 270, obs.size, obs.size);
                });

                // Coins
                ctx.fillStyle = "#ffd700";
                coinItems.forEach(c => {
                    ctx.beginPath();
                    ctx.arc(c.x, c.y, 8, 0, Math.PI * 2);
                    ctx.fill();
                });
            } else if (gameState === "START") {
                ctx.fillStyle = "#ffffff";
                ctx.font = "12px 'Press Start 2P'";
                ctx.textAlign = "center";
                ctx.fillText("TAP TO START", 200, 190);
                ctx.fillStyle = "#00ffcc";
                ctx.font = "8px 'Press Start 2P'";
                ctx.fillText("KEEP HAMSTER ALIVE!", 200, 220);
            } else if (gameState === "GAMEOVER") {
                ctx.fillStyle = "#ff007a";
                ctx.font = "14px 'Press Start 2P'";
                ctx.textAlign = "center";
                ctx.fillText("GAME OVER!", 200, 180);
                ctx.fillStyle = "#ffffff";
                ctx.font = "8px 'Press Start 2P'";
                ctx.fillText("SCORE: " + Math.floor(score) + "m", 200, 210);
                ctx.fillText("TAP TO RESTART", 200, 235);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
